# Secret scanning (scripts/hygiene.sh). The default rules, minus the IntelliJ
# Platform Gradle plugin's sandbox (ide/intellij/.intellijPlatform): IDE state
# written by `./gradlew runIde`, git-ignored and never committed.
[extend]
useDefault = true

[[allowlists]]
description = "IntelliJ plugin sandbox state (git-ignored)"
paths = ['''(^|/)\.intellijPlatform/''']

[[allowlists]]
description = "The Standard Webhooks specification's published test vector (its key and message ID), which the signing tests check against"
regexes = ['''MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw''', '''msg_p5jXN8AQM9LWM0D4loKWxJek''']

[[allowlists]]
description = "The parcels example's made-up shop webhook key: whsec_ and example-shop-webhook-key in base64"
regexes = ['''^whsec_ZXhhbXBsZS1zaG9wLXdlYmhvb2sta2V5$''']

[[allowlists]]
description = "Chrome's WebMCP origin-trial token for nimbusxr.us (docs/astro.config.mjs): public by design, served in every page's HTML"
regexes = ['''Au6\+vW\+zV403Rr8nG3rt7t4kt0d4TKhCO//DVEhDvH2tcoxBvC/HCQ7Bk5aJRg6KMMKAdc82K1Eux4vwRQl1SQ0AAABeeyJvcmlnaW4iOiJodHRwczovL25pbWJ1c3hyLnVzOjQ0MyIsImZlYXR1cmUiOiJXZWJNQ1AiLCJleHBpcnkiOjE4MDYzNjQ4MDAsImlzU3ViZG9tYWluIjp0cnVlfQ==''']
