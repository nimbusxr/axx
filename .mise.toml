[tools]
go = "1.27.3"
golangci-lint = "2"
goreleaser = "2"
lefthook = "2.1.17"
node = "22"          # docs site only
java = "temurin-21"  # WireMock extension and IntelliJ plugin only
"aqua:gitleaks/gitleaks" = "latest"
"aqua:git-lfs/git-lfs" = "3"  # the examples' model files (examples/.gitattributes)
"aqua:sharkdp/hyperfine" = "latest"  # bench/
"aqua:rhysd/actionlint" = "latest"
"aqua:gotestyourself/gotestsum" = "latest"  # scripts/gotest.sh, in CI
uv = "0.13.6"  # the models-core pack's integration tests (Python runtimes), and the parcel-support example

[tasks.test]
run = "go test -race ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.generate]
run = "go generate ./..."

[tasks.hygiene]
run = "scripts/hygiene.sh"

[tasks.intellij]
description = "IntelliJ IDEA with the axx plugin, the Go plugin and axx from this tree (scripts/intellij-sandbox.sh)"
run = "scripts/intellij-sandbox.sh"
