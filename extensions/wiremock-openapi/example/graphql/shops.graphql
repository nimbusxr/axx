# The subgraph smoke-test.sh mocks: GRAPHQL_SCHEMA_SOURCE names it.
extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

type Query {
  shop(id: ID!): Shop
}

type Shop @key(fields: "id") {
  id: ID!
  name: String!
  tier: Tier!
}

enum Tier {
  STANDARD
  GOLD
}
