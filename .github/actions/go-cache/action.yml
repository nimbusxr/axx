# SPDX-License-Identifier: Apache-2.0
name: go-cache
description: >-
  Go's module and build caches. Restore them right after installing Go, and save them as the
  job's last step: saving only happens on pushes to main, so pull requests use the caches but
  never write them. Jobs that publish use no cache at all.

  The module cache is what go.sum says, so it is keyed by go.sum. The build cache changes with
  every commit, and a cache's key is written once: each push to main keeps its own, by commit,
  and a run restores the newest one (for its go.sum, else any).

  A job that restores the module cache then downloads the modules of go.mod it lacks, trying a
  failed download again (scripts/go-mod-download.sh), so that the job's builds download none.
inputs:
  build:
    description: >-
      Name of the build cache (lint, test, cross...). Jobs with the same name share it. Empty: no
      build cache, for a job that builds with flags no cache was built with.
    default: ""
  mode:
    description: "`restore` or `save`."
    default: restore
  modules:
    description: >-
      restore: also restore the module cache, which every job on an OS shares. save: also save
      it; one job per OS does.
    default: "true"
  extra-paths:
    description: More directories kept with the build cache, one per line (e.g. golangci-lint's).
    default: ""
runs:
  using: composite
  steps:
    - id: go
      shell: bash
      run: |
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - if: inputs.mode == 'restore' && inputs.modules == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go.outputs.mod }}
        # v2: the caches saved since the step below is here. go mod download keeps a small file
        # of each module that a build does not (its .info), and with those in the cache the
        # step asks the proxy for nothing. The caches from before (the second restore key) are
        # read until main has saved one: with them the step asks for those files, one for
        # each module (228 of them, in 6 seconds on a MacBook).
        key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-v2-${{ runner.os }}-
          go-mod-${{ runner.os }}-
    # The modules the restored cache lacks: those a pull request updates, or all of them when
    # the restore broke off. Downloaded here, a download that fails is tried again; left to the
    # build, it failed the job, since the go command asks once. With every module there, this
    # takes a fraction of a second.
    - if: inputs.mode == 'restore' && inputs.modules == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash scripts/go-mod-download.sh
    - if: inputs.mode == 'restore' && inputs.build != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go.outputs.build }}
          ${{ inputs.extra-paths }}
        key: go-build-${{ runner.os }}-${{ inputs.build }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ inputs.build }}-${{ hashFiles('go.sum') }}-
          go-build-${{ runner.os }}-${{ inputs.build }}-
    - if: >-
        inputs.mode == 'save' && inputs.modules == 'true'
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
      # A key is never overwritten: saving one that exists only warns. And a cache is an
      # optimization: failing to save it fails nothing.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go.outputs.mod }}
        key: go-mod-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}
    - if: >-
        inputs.mode == 'save' && inputs.build != ''
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
      # A key is never overwritten: saving one that exists only warns. And a cache is an
      # optimization: failing to save it fails nothing.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go.outputs.build }}
          ${{ inputs.extra-paths }}
        key: go-build-${{ runner.os }}-${{ inputs.build }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
