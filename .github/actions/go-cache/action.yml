# SPDX-License-Identifier: Apache-2.0
name: go-cache
description: >-
  Go's module and build caches. Restore them right after installing Go, and save them as the
  job's last step: saving only happens on pushes to main, so pull requests use the caches but
  never write them. Jobs that publish use no cache at all.
inputs:
  build:
    description: Name of the build cache (lint, test, cross...). Jobs with the same name share it.
    required: true
  mode:
    description: "`restore` or `save`."
    default: restore
  modules:
    description: >-
      restore: also restore the module cache, which every job on an OS shares. save: also save
      it; one job per OS does.
    default: "true"
  extra-paths:
    description: More directories kept with the build cache, one per line (e.g. golangci-lint's).
    default: ""
runs:
  using: composite
  steps:
    - id: go
      shell: bash
      run: |
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - if: inputs.mode == 'restore' && inputs.modules == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go.outputs.mod }}
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: go-mod-${{ runner.os }}-
    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go.outputs.build }}
          ${{ inputs.extra-paths }}
        key: go-build-${{ runner.os }}-${{ inputs.build }}-${{ hashFiles('go.sum') }}
        restore-keys: go-build-${{ runner.os }}-${{ inputs.build }}-
    - if: >-
        inputs.mode == 'save' && inputs.modules == 'true'
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
      # A key is never overwritten: saving one that exists only warns. And a cache is an
      # optimization: failing to save it fails nothing.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go.outputs.mod }}
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
    - if: >-
        inputs.mode == 'save'
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
      # A key is never overwritten: saving one that exists only warns. And a cache is an
      # optimization: failing to save it fails nothing.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go.outputs.build }}
          ${{ inputs.extra-paths }}
        key: go-build-${{ runner.os }}-${{ inputs.build }}-${{ hashFiles('go.sum') }}
