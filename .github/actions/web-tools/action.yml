# SPDX-License-Identifier: Apache-2.0
name: web-tools
description: >-
  What the web packs download on first use: the browsers, and the Playwright driver, Node.js,
  axe-core and Lighthouse axx prepares, cached by their versions, and the browsers' system
  libraries. Restore them before the web packs run, and save them as the job's last step:
  saving only happens on pushes to main, like Go's caches.
inputs:
  mode:
    description: "`restore` (with the system libraries) or `save`."
    default: restore
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        versions=$({
          grep -hE '(CoreVersion|NodeVersion|patchRevision|lighthouseVersion) *=|Name: "axe-core"' \
            packs/web/internal/driver/*.go internal/npm/node.go packs/web/lighthouse/install.go packs/web/a11y/a11y.go
          sha256sum packs/web/lighthouse/npm/package-lock.json
        } | sha256sum | cut -c1-16)
        echo "key=web-tools-${RUNNER_OS}-${versions}" >> "$GITHUB_OUTPUT"
    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/axx/web
        key: ${{ steps.key.outputs.key }}
    - if: inputs.mode == 'restore'
      name: the browsers' system libraries
      shell: bash
      run: |
        version=$(sed -n 's/^const CoreVersion = "\(.*\)"$/\1/p' packs/web/internal/driver/driver.go)
        # apt waits forever on a mirror that stops answering (a job hung 29 minutes on one): it
        # gives up on a stalled download after 30 seconds and tries it again, and the install,
        # which takes about a minute, is tried again if it takes over four.
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts > /dev/null
        for attempt in 1 2 3; do
          if sudo timeout --kill-after=15s 4m npx -y "playwright@$version" install-deps chromium firefox webkit; then
            exit 0
          fi
          echo "::warning::installing the browsers' system libraries failed or stalled (attempt $attempt of 3)"
        done
        exit 1
    - if: inputs.mode == 'save' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      # A cache is an optimization: failing to save it fails nothing.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/axx/web
        key: ${{ steps.key.outputs.key }}
