# SPDX-License-Identifier: Apache-2.0
name: lfs
description: >-
  The examples' model files, which Git LFS keeps (examples/.gitattributes), in place of the
  pointers a checkout leaves. Run it right after the checkout. Its objects come from a cache
  where it has them, and only those it lacks from GitHub: saving the cache only happens on
  main, on a push and in the nightly run, so pull requests use it but never write it. The
  nightly run saves it too because it runs every job: a push runs only the jobs its files
  need, so the jobs it skips (the macOS ones, most days) would have no cache, and fail
  whenever GitHub's LFS does.

  The cache is what the LFS files are, so it is keyed by their objects' IDs, and a run whose
  files changed restores the newest one, for the objects it shares.
runs:
  using: composite
  steps:
    - id: lfs
      shell: bash
      run: |
        git lfs install --local > /dev/null
        echo "objects=$(git lfs ls-files --long | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .git/lfs/objects
        key: lfs-${{ runner.os }}-${{ steps.lfs.outputs.objects }}
        restore-keys: lfs-${{ runner.os }}-
    # GitHub's LFS answers "We couldn't respond to your request in time" now and then: a
    # pull that failed is tried again, and keeps the objects the tries before it got.
    - shell: bash
      run: |
        for wait in 15 30 45 0; do
          if git lfs pull; then
            exit 0
          fi
          if [ "$wait" != 0 ]; then
            echo "git lfs pull failed: trying again in ${wait}s"
            sleep "$wait"
          fi
        done
        echo "::error::git lfs pull failed four times"
        exit 1
    - if: >-
        steps.cache.outputs.cache-hit != 'true'
        && (github.event_name == 'push' || github.event_name == 'schedule')
        && github.ref == 'refs/heads/main'
      # A cache is an optimization: failing to save it fails nothing.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .git/lfs/objects
        key: lfs-${{ runner.os }}-${{ steps.lfs.outputs.objects }}
