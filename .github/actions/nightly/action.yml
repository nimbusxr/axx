# SPDX-License-Identifier: Apache-2.0
name: nightly
description: >-
  What a job's tests left for the nightly run (scripts/gotest.sh, with AXX_NIGHTLY): the profiles
  of the statements they ran, kept for the coverage job to add up, and the memory checker's
  reports, each a fault in axx's C, C++ or Objective-C, which fail the job and are kept with it.
  A job that was to check memory (its tests had AXX_MEMCHECK) also shows what it checked: the
  libraries axx built under the checker, each looked at. One that built none checked nothing, and
  fails for it: that its tests passed says nothing then.
  A job that left none of these does nothing here.
runs:
  using: composite
  steps:
    - id: left
      shell: bash
      run: |
        temp=${RUNNER_TEMP//\\//} # a Windows runner's, for bash
        # A name of its own for each job of a matrix.
        echo "name=$GITHUB_JOB-$RANDOM$RANDOM" >> "$GITHUB_OUTPUT"
        if compgen -G "$temp/coverage/*.out" > /dev/null; then
          echo "coverage=true" >> "$GITHUB_OUTPUT"
        fi
        if compgen -G "$temp/memcheck/report.*" > /dev/null; then
          echo "faults=true" >> "$GITHUB_OUTPUT"
          for report in "$temp"/memcheck/report.*; do
            echo "::error::The memory checker found a fault in axx's native code ($(basename "$report")): its report is below, and kept with the run."
            sed -n '1,80p' "$report"
          done
        fi
        # The folder is there when the job's tests were to check memory (scripts/gotest.sh makes
        # it, or the job): its list has the libraries axx built checked (memcheck.Record).
        if [ -d "$temp/memcheck" ]; then
          if [ ! -s "$temp/memcheck/libraries" ]; then
            echo "::error::The job was to check memory, and axx built no library under the checker: nothing was checked."
            echo "unchecked=true" >> "$GITHUB_OUTPUT"
          else
            echo "Built under the memory checker:"
            while IFS= read -r library; do
              if [ ! -f "$library" ]; then
                echo "::error::A library listed as built under the memory checker is not there: $library"
                echo "unchecked=true" >> "$GITHUB_OUTPUT"
              elif command -v otool > /dev/null && ! otool -L "$library" | grep -q libclang_rt.asan; then
                echo "::error::A library listed as built under the memory checker does not link it: $library"
                echo "unchecked=true" >> "$GITHUB_OUTPUT"
              elif ! command -v otool > /dev/null && command -v readelf > /dev/null && ! readelf -d "$library" | grep -q -E 'libclang_rt\.(hw)?asan'; then
                # An Android agent, on a Linux runner: AddressSanitizer's runtime, or on arm64
                # HWAddressSanitizer's.
                echo "::error::A library listed as built under the memory checker does not link it: $library"
                echo "unchecked=true" >> "$GITHUB_OUTPUT"
              else
                echo "  $library"
              fi
            done < <(sort -u "$temp/memcheck/libraries")
          fi
        fi
    - if: steps.left.outputs.coverage == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: statements-${{ steps.left.outputs.name }}
        path: ${{ runner.temp }}/coverage/*.out
        retention-days: 3
    - if: steps.left.outputs.faults == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: memory-faults-${{ steps.left.outputs.name }}
        path: ${{ runner.temp }}/memcheck/report.*
        retention-days: 30
    - if: steps.left.outputs.faults == 'true' || steps.left.outputs.unchecked == 'true'
      shell: bash
      run: exit 1
