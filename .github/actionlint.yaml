# actionlint (ci.yml's workflows job): the labels of the project's self-hosted runners, and of
# GitHub's runners newer than actionlint's own list (1.7.12's ends at Ubuntu 24.04).
self-hosted-runner:
  labels:
    # Foundation Models' public provider API and Simulator integration.
    - xcode-27
    # GitHub's Ubuntu 26.04 runners.
    - ubuntu-26.04
    - ubuntu-26.04-arm
    # The Mac mini that mac-mini.yml runs on.
    - mac-mini
    # The Reatan (a Windows mini PC) that reatan.yml runs on.
    - reatan
