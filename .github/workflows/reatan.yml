name: reatan

# What needs a Windows desktop at the scale the Windows screenshots are kept at, which GitHub's
# Windows runners cannot give (they draw at a scale of 1, in images that change): the depot desk's
# native Windows builds. They run on the project's Reatan, a mini PC that is a self-hosted runner
# (label reatan) in the reatan runner group, which only this file, as it is on main, may use: the
# group names it.
#
# Pull requests run here through the runners workflow (runners.yml), whose job starts this file on
# main with the pull request's number, as a manual run: the jobs are main's copy, never the pull
# request's, and the runner group lets in this file at main and nothing else. Starting a workflow
# takes a token that writes, which a fork's pull request never has, whatever it changes. Only
# pull requests from this repository's own branches run, which only people with write access can
# push; a fork's never does, nor a bot's dependency update: they run once they are merged.
on:
  push:
    branches: [main]
  # By hand, or for a pull request, whose own run hands it over (runners.yml), with its number.
  workflow_dispatch:
    inputs:
      pr:
        description: A pull request's number, to run its code. Empty runs main's.
        type: string
        required: false

permissions:
  contents: read

# One runner: runs queue for it. A pull request's newer push cancels its older run.
concurrency:
  group: reatan-${{ github.event.inputs.pr || github.ref }}
  cancel-in-progress: ${{ github.event.inputs.pr != '' }}

jobs:
  # Which jobs a pull request needs, from the files it changes, with main's scripts/ci-changes.sh
  # (the job runs on main) and the pull request's list of files: nothing of the
  # pull request's is checked out here. A push to main runs the jobs for what a bot's merged pull
  # request changed (bots' pull requests do not run here); everyone else's ran before the merge,
  # so their pushes run nothing. Manual runs run every job.
  changes:
    # The gate. Main only (a manual run from another branch could not use the Reatan anyway), and
    # of pushes, a bot's merge. A pull request handed over (a manual run with its number) is held
    # by the first step to what GitHub says of it: an open one for main, from this repository's
    # branches, not a bot's.
    if: >-
      github.ref == 'refs/heads/main' && (
      (github.event_name == 'push' && endsWith(github.event.head_commit.author.name, '[bot]')) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write # a handed-over pull request's status
    outputs:
      sha: ${{ steps.changes.outputs.sha }}
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2 # a push's merge and the commit before it
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          HANDED: ${{ github.event.inputs.pr }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$HANDED" ]; then
            case "$HANDED" in
              *[!0-9]*)
                echo "::error::Not a pull request's number: $HANDED" >&2
                exit 1
                ;;
            esac
            pull=$(gh api "repos/$REPO/pulls/$HANDED")
            if jq -e --arg repo "$REPO" '.state == "open" and .base.ref == "main" and
                .head.repo.full_name == $repo and .user.type != "Bot"' <<<"$pull" > /dev/null; then
              echo "sha=$(jq -r .head.sha <<<"$pull")"
              gh api "repos/$REPO/pulls/$HANDED/files" --paginate --jq '.[].filename' | scripts/ci-changes.sh
            else
              echo "::notice::Pull request $HANDED does not run here: only an open one for main, from this repository's branches, not a bot's." >&2
              scripts/ci-changes.sh --none
            fi
          elif [ "$EVENT" = push ] && files=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$files" | scripts/ci-changes.sh
          else
            scripts/ci-changes.sh --all
          fi | tee -a "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.sha != '' && steps.changes.outputs.desktop == 'true'
        name: tell the pull request it runs here
        env:
          SHA: ${{ steps.changes.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" -f state=pending -f context=reatan \
            -f description="Running on the Reatan" -f target_url="$RUN" > /dev/null

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # The depot desk's feature against its native Windows builds, through UI Automation, on the
    # Reatan's desktop: the runner starts when the user the Reatan signs in on its own signs in, in
    # a console of its own (conhost), as axx needs on Windows: a service or an SSH session has no
    # desktop, and an app comes to the front as the console axx runs in lets it. The display is 4K
    # at 250%, the scale the Windows Forms and WPF screenshots are kept at (*.windows@2.5x.png).
    # The other Windows builds (Qt, Swing, Electron, Tauri, Flutter) need their toolkits on the
    # Reatan, and still run on developers' machines.
    name: desktop (windows-${{ matrix.build }})
    runs-on: [self-hosted, Windows, X64, reatan]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [winforms, wpf, winui]
    env:
      BUILD: ${{ matrix.build }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A handed-over pull request's code: only ever one of this repository's branches (see the gate).
          ref: ${{ needs.changes.outputs.sha || github.sha }}
          persist-credentials: false
      # The desk's model files (Git LFS: examples/.gitattributes), its desk-models scenarios'
      # stubs, with Git for Windows' git-lfs. As on the Mac mini, Git LFS is not installed in the
      # checkout: its filters are the pull's alone, and the hooks it writes go to this job's
      # temporary folder. The Reatan keeps the files between runs, in the checkout's .git.
      - name: the desk's model files
        run: |
          mkdir -p "$RUNNER_TEMP/lfs-hooks"
          git -c core.hooksPath="$RUNNER_TEMP/lfs-hooks" \
            -c filter.lfs.clean="git-lfs clean -- %f" -c filter.lfs.smudge="git-lfs smudge -- %f" \
            -c filter.lfs.process="git-lfs filter-process" -c filter.lfs.required=true \
            lfs pull --include "examples/parcels/depot-desk/**"
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "go"
          cache: false
      # The steps that run it put it on their own PATH.
      - name: axx, with every pack
        run: go build -o "$RUNNER_TEMP/bin/axx.exe" ./internal/tools/axxall
      - name: the desk's build
        working-directory: examples/parcels/depot-desk/${{ matrix.build }}
        # WinUI builds for a platform: the Reatan's is x64.
        run: |
          if [ "$BUILD" = winui ]; then
            dotnet build -c Release -p:Platform=x64
          else
            dotnet build -c Release
          fi
      - name: Windows gives the runner a desktop
        working-directory: examples/parcels/depot-desk/acceptance
        run: |
          PATH="$(cygpath -u "$RUNNER_TEMP")/bin:$PATH"
          axx doctor --profile "windows-$BUILD"
      - working-directory: examples/parcels/depot-desk/acceptance
        run: |
          PATH="$(cygpath -u "$RUNNER_TEMP")/bin:$PATH"
          axx run --profile "windows-$BUILD" --format progress --format junit:build/axx/junit.xml --format html:build/axx/report.html
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reatan-desktop-${{ matrix.build }}
          # The report, and the screenshots, traces and logs a failure leaves.
          path: |
            examples/parcels/depot-desk/acceptance/build/axx/
            examples/parcels/depot-desk/acceptance/.axx/
          if-no-files-found: ignore
          retention-days: 7

  # What a handed-over pull request sees of its run: one status, reatan, on the commit that ran,
  # with this run behind it. On GitHub's runner: the jobs on the Reatan hold no token that writes.
  report:
    needs: [changes, desktop]
    if: ${{ !cancelled() && needs.changes.outputs.sha != '' && needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ needs.changes.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            state=failure description="Failed on the Reatan: $failed"
          else
            state=success description="Passed on the Reatan"
          fi
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context=reatan \
            -f description="$description" -f target_url="$RUN" > /dev/null
