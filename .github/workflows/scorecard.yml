# OpenSSF Scorecard supply-chain analysis, published to the Security tab and to the public
# OpenSSF API. It runs once the AXX_PUBLISH repository variable is "true" (a public repository).
name: scorecard

# Nightly, and by hand on main, to see what a merge fixed sooner. Not on every push: Binary-Artifacts
# counts the Gradle wrappers' jars as checked only once gradle-wrappers.yml has passed on main's
# latest commit, which a run started by the same push would not wait for.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    if: vars.AXX_PUBLISH == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
