# OpenSSF Scorecard supply-chain analysis, published to the Security tab and to the public
# OpenSSF API. It runs once the AXX_PUBLISH repository variable is "true" (a public repository).
name: scorecard

# Weekly: nothing a merge changes that it scores needs it sooner.
on:
  schedule:
    - cron: "41 5 * * 2"

permissions: {}

jobs:
  analysis:
    if: vars.AXX_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
