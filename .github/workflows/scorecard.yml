# OpenSSF Scorecard supply-chain analysis, published to the Security tab and to the public
# OpenSSF API. It runs once the AXX_PUBLISH repository variable is "true" (a public repository).
name: scorecard

# Weekly, and by hand on main, to see what a merge fixed sooner. Not on every push: Binary-Artifacts
# counts the Gradle wrappers' jars as checked only once gradle-wrappers.yml has passed on main's
# latest commit, which a run started by the same push would not wait for.
on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    if: vars.AXX_PUBLISH == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
