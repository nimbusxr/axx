# Blocks pull requests that add dependencies with known vulnerabilities or
# licenses incompatible with Apache-2.0.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          # Dual-licensed ("MIT OR GPL-2.0-or-later"): axx uses it under MIT. It comes with
          # Appium's FTP support (jsftp), in packs/mobile/android/appium/package-lock.json.
          allow-dependencies-licenses: pkg:npm/unorm@1.6.0
          comment-summary-in-pr: on-failure
