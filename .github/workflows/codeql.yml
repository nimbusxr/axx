# Static analysis of every language in the repository.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read # the run's details, which private and internal repositories do not expose otherwise
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go has no build-free mode: CodeQL's autobuild builds the module with the Go version
          # go.mod asks for.
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f443b600d91635bebf5b0d9ebc620189c0d6fba5 # v4.30.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@f443b600d91635bebf5b0d9ebc620189c0d6fba5 # v4.30.8
        with:
          category: /language:${{ matrix.language }}
