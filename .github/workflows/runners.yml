name: runners

# Pull requests on the project's own machines: the Mac mini (mac-mini.yml) and the Reatan
# (reatan.yml). This workflow's one job hands the pull request over: it starts the two on main,
# with the pull request's number, as a manual run of them is started. They run as they are on
# main, whatever the pull request changes (each machine's runner group lets in its file at main
# and nothing else), ask GitHub what the pull request is, and tell it how they went with a status
# each on its commit (mac-mini, reatan).
#
# Starting a workflow takes a token that writes, and a fork's pull request never has one: it
# cannot reach the machines by changing this file, or by any other. No pull_request_target, and
# no workflow called at a branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  hand-over:
    # This repository's own branches, not a bot's: what the two workflows admit. (They check it
    # again, from what GitHub says of the pull request.)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write # starts mac-mini.yml and reatan.yml on main
    steps:
      - env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run mac-mini.yml --repo "$REPO" --ref main -f pr="$PR"
          gh workflow run reatan.yml --repo "$REPO" --ref main -f pr="$PR"
