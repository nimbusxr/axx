name: mac-mini

# What needs a Mac and Docker together, which GitHub's macOS runners cannot give (they have no
# Docker): the parcels example's iOS scenarios against the service and all of its
# infrastructure, and the depot desk's native macOS builds. They run on the project's Mac mini, a
# self-hosted runner (label mac-mini) in the mac-mini runner group, which only this file, as it is
# on main, may use: the group names it.
#
# Pull requests run here through the runners workflow (runners.yml), whose job starts this file on
# main with the pull request's number, as a manual run: the jobs are main's copy, never the pull
# request's, and the runner group lets in this file at main and nothing else. Starting a workflow
# takes a token that writes, which a fork's pull request never has, whatever it changes. Only
# pull requests from this repository's own branches run, which only people with write access can
# push; a fork's never does, nor a bot's dependency update: they run once they are merged.
on:
  push:
    branches: [main]
  # By hand, or for a pull request, whose own run hands it over (runners.yml), with its number.
  workflow_dispatch:
    inputs:
      pr:
        description: A pull request's number, to run its code. Empty runs main's.
        type: string
        required: false

permissions:
  contents: read

# One runner: runs queue for it. A pull request's newer push cancels its older run.
concurrency:
  group: mac-mini-${{ github.event.inputs.pr || github.ref }}
  cancel-in-progress: ${{ github.event.inputs.pr != '' }}

jobs:
  # Which jobs a pull request needs, from the files it changes, with main's scripts/ci-changes.sh
  # (the job runs on main) and the pull request's list of files: nothing of the
  # pull request's is checked out here. A push to main runs the jobs for what a bot's merged pull
  # request changed (bots' pull requests do not run here); everyone else's ran before the merge,
  # so their pushes run nothing. Manual runs run every job.
  changes:
    # The gate. Main only (a manual run from another branch could not use the mini anyway), and
    # of pushes, a bot's merge. A pull request handed over (a manual run with its number) is held
    # by the first step to what GitHub says of it: an open one for main, from this repository's
    # branches, not a bot's.
    if: >-
      github.ref == 'refs/heads/main' && (
      (github.event_name == 'push' && endsWith(github.event.head_commit.author.name, '[bot]')) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write # a handed-over pull request's status
    outputs:
      sha: ${{ steps.changes.outputs.sha }}
      mobile: ${{ steps.changes.outputs.mobile }}
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2 # a push's merge and the commit before it
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          HANDED: ${{ github.event.inputs.pr }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$HANDED" ]; then
            case "$HANDED" in
              *[!0-9]*)
                echo "::error::Not a pull request's number: $HANDED" >&2
                exit 1
                ;;
            esac
            pull=$(gh api "repos/$REPO/pulls/$HANDED")
            if jq -e --arg repo "$REPO" '.state == "open" and .base.ref == "main" and
                .head.repo.full_name == $repo and .user.type != "Bot"' <<<"$pull" > /dev/null; then
              echo "sha=$(jq -r .head.sha <<<"$pull")"
              gh api "repos/$REPO/pulls/$HANDED/files" --paginate --jq '.[].filename' | scripts/ci-changes.sh
            else
              echo "::notice::Pull request $HANDED does not run here: only an open one for main, from this repository's branches, not a bot's." >&2
              scripts/ci-changes.sh --none
            fi
          elif [ "$EVENT" = push ] && files=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$files" | scripts/ci-changes.sh
          else
            scripts/ci-changes.sh --all
          fi | tee -a "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.sha != '' && (steps.changes.outputs.mobile == 'true' || steps.changes.outputs.desktop == 'true')
        name: tell the pull request it runs here
        env:
          SHA: ${{ steps.changes.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" -f state=pending -f context=mac-mini \
            -f description="Running on the Mac mini" -f target_url="$RUN" > /dev/null

  ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    # The parcels example's iOS scenarios (@ios), as its README runs them: axx starts the service
    # and all of its infrastructure with Docker Compose (Colima, on the mini), and runs the
    # couriers' iOS app on simulators it makes. The mini keeps what ci.yml's ios job restores
    # every time (WebDriverAgent, the simulators and the iOS runtime's shared cache), its
    # Go and mise caches, and the compose file's images and build cache: nothing is restored or
    # saved. GitHub's cache is not used at all.
    # Three simulators run scenarios at once: on the mini, a suite of 38 iOS scenarios took 17m48s
    # on one simulator, 11m20s on two and 9m56s on three.
    runs-on: [self-hosted, macOS, ARM64, mac-mini]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A handed-over pull request's code: only ever one of this repository's branches (see the gate).
          ref: ${{ needs.changes.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "go aqua:git-lfs/git-lfs"
          cache: false
      # The examples' model files (Git LFS: examples/.gitattributes), the couriers' app's among
      # them. The mini keeps them between runs, in the checkout's .git. The checkout is every
      # job's on the mini, and each job checks it out before it has git-lfs: Git LFS is not
      # installed in it, as its hooks would stop the next checkout. Its filters are the pull's
      # alone, and the hooks it writes go to this job's temporary folder.
      - name: the examples' model files
        run: |
          mkdir -p "$RUNNER_TEMP/lfs-hooks"
          git -c core.hooksPath="$RUNNER_TEMP/lfs-hooks" \
            -c filter.lfs.clean="git-lfs clean -- %f" -c filter.lfs.smudge="git-lfs smudge -- %f" \
            -c filter.lfs.process="git-lfs filter-process" -c filter.lfs.required=true \
            lfs pull
      # The steps that run it put it on their own PATH.
      - name: axx, with every pack
        run: go build -o "$RUNNER_TEMP/bin/axx" ./internal/tools/axxall
      - name: the couriers' app
        working-directory: examples/parcels/courier/ios
        run: xcodebuild -project Courier.xcodeproj -target Courier -configuration Debug -sdk iphonesimulator ONLY_ACTIVE_ARCH=NO SYMROOT=build
      - name: the fixtures, as a fresh clone has them
        working-directory: examples/parcels/acceptance
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          axx fixtures check
          axx fixtures generate
      - working-directory: examples/parcels/acceptance
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          axx run --tags @ios --format progress --format junit:build/axx/junit.xml --format html:build/axx/report.html \
            --set packs.mobile-core.traces=failed --set packs.mobile-core.videos=failed --set packs.mobile-ios.devices=3
      # The scenarios whose pages run a model on the GPU, through WebGPU (@gpu): the mini's has
      # Metal, and ci.yml's Linux runners have no GPU.
      - name: the scenarios that need a GPU
        working-directory: examples/parcels/acceptance
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          axx run --tags @gpu --format progress --format html:build/axx/report-gpu.html
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac-mini-ios
          # The report, and the traces, videos, screenshots, page sources and logs a failure leaves.
          path: |
            examples/parcels/acceptance/build/axx/
            examples/parcels/acceptance/.axx/mobile/
            examples/parcels/acceptance/.axx/logs/
          if-no-files-found: ignore
          retention-days: 7
      # axx run removes the example when it ends; a run that is cancelled or times out may not
      # get to, and the next one would find the example's ports taken.
      - if: always()
        name: the example, removed
        run: docker compose -f examples/parcels/infra/compose.yaml down -v --remove-orphans

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # The depot desk's feature against its native macOS builds, through macOS's accessibility tree,
    # on the mini's desktop: the runner runs in the session of the user the mini logs in on its
    # own. macOS must let axx use the accessibility tree and capture windows, which `axx doctor`
    # checks first. For a job, macOS asks that of the first program not its own that started it:
    # the mini starts its runner through a small launcher of its own, which it allows both, so
    # every build of axx is allowed with nothing to do here. The other macOS builds (Qt, Swing,
    # Electron, Tauri, Flutter) need their toolkits on the mini, and still run on developers' Macs.
    name: desktop (macos-${{ matrix.build }})
    runs-on: [self-hosted, macOS, ARM64, mac-mini]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [appkit, swiftui]
    env:
      BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A handed-over pull request's code: only ever one of this repository's branches (see the gate).
          ref: ${{ needs.changes.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "go"
          cache: false
      # The steps that run it put it on their own PATH.
      - name: axx, with every pack
        run: go build -o "$RUNNER_TEMP/bin/axx" ./internal/tools/axxall
      - name: the desk's build
        run: examples/parcels/depot-desk/"$BUILD"/build.sh
      - name: macOS lets the runner drive and capture apps
        working-directory: examples/parcels/depot-desk/acceptance
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          axx doctor --profile "macos-$BUILD"
      - working-directory: examples/parcels/depot-desk/acceptance
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          axx run --profile "macos-$BUILD" --format progress --format junit:build/axx/junit.xml --format html:build/axx/report.html
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac-mini-desktop-${{ matrix.build }}
          # The report, and the screenshots, traces and logs a failure leaves.
          path: |
            examples/parcels/depot-desk/acceptance/build/axx/
            examples/parcels/depot-desk/acceptance/.axx/
          if-no-files-found: ignore
          retention-days: 7

  # What a handed-over pull request sees of its run: one status, mac-mini, on the commit that ran,
  # with this run behind it. On GitHub's runner: the jobs on the Mac mini hold no token that writes.
  report:
    needs: [changes, ios, desktop]
    if: ${{ !cancelled() && needs.changes.outputs.sha != '' && (needs.changes.outputs.mobile == 'true' || needs.changes.outputs.desktop == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ needs.changes.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            state=failure description="Failed on the Mac mini: $failed"
          else
            state=success description="Passed on the Mac mini"
          fi
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context=mac-mini \
            -f description="$description" -f target_url="$RUN" > /dev/null
