# SPDX-License-Identifier: Apache-2.0
# Builds and tests the axx IntelliJ plugin; release.yml calls it for intellij-v<version>
# releases to publish the plugin to the JetBrains Marketplace, and for release dry runs to
# verify and sign it without uploading. Nothing is uploaded unless the AXX_PUBLISH repository
# variable is "true".
name: intellij-plugin

on:
  pull_request:
    paths:
      - ide/intellij/**
      - .github/workflows/intellij-plugin.yml
  push:
    branches: [main]
    paths:
      - ide/intellij/**
      - .github/workflows/intellij-plugin.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: release tag to build (intellij-v<version>)
        type: string
        required: true
      version:
        description: released version, e.g. 0.1.0
        type: string
        required: true
      dry-run:
        description: verify and sign the plugin a release would publish, and upload nothing
        type: boolean
        default: false
    secrets:
      JETBRAINS_MARKETPLACE_TOKEN:
        required: false
      JETBRAINS_CERTIFICATE_CHAIN:
        required: false
      JETBRAINS_PRIVATE_KEY:
        required: false
      JETBRAINS_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: intellij-plugin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: ide/intellij

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # Validation only; Gradle caching comes from setup-java below.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            ide/intellij/*.gradle.kts
            ide/intellij/gradle.properties
            ide/intellij/gradle/wrapper/gradle-wrapper.properties
      - run: ./gradlew --no-daemon --console=plain build buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: axx-intellij-plugin
          path: ide/intellij/build/distributions/*.zip
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: axx-intellij-test-reports
          path: ide/intellij/build/reports/tests/
          retention-days: 7

  publish:
    if: inputs.version != '' && (inputs.dry-run || vars.AXX_PUBLISH == 'true')
    needs: build
    runs-on: ubuntu-latest
    # Publishing reads the signing key and Marketplace token from the release environment
    # (main only, approved by a maintainer); the secrets passed in are then unused. A dry run
    # uses no environment, so it verifies the plugin without signing it.
    environment: ${{ !inputs.dry-run && 'release' || '' }}
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
      VERSION: ${{ inputs.version }}
    steps:
      - id: secrets
        name: check publishing secrets
        working-directory: .
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ -n "$CERTIFICATE_CHAIN" && -n "$PRIVATE_KEY" ]]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [[ "$DRY_RUN" == true ]]; then
            echo "::notice::A dry run does not sign the plugin: the signing key is only available to releases (the release environment)."
          fi
          if [[ -n "$PUBLISH_TOKEN" && -n "$CERTIFICATE_CHAIN" && -n "$PRIVATE_KEY" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$DRY_RUN" != true ]]; then
            echo "::warning::Skipping JetBrains Marketplace publishing: set the JETBRAINS_MARKETPLACE_TOKEN, JETBRAINS_CERTIFICATE_CHAIN and JETBRAINS_PRIVATE_KEY secrets (plus JETBRAINS_PRIVATE_KEY_PASSWORD for an encrypted key)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          # No Gradle cache: a published plugin is built from scratch, and a dry run's cache
          # would hold the IDEs the plugin verifier downloads (many GB).

      # Dry run: what the Marketplace checks (the plugin verifier against the recommended IDEs)
      # and the signed plugin, kept on the run. The IDEs the verifier downloads need more disk
      # than a runner has free, so remove toolchains the build never uses first.
      - if: inputs.dry-run
        name: free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - if: inputs.dry-run
        name: verify and sign (dry run)
        env:
          SIGN: ${{ steps.secrets.outputs.sign }}
        run: |
          tasks=(verifyPlugin)
          if [[ "$SIGN" == true ]]; then tasks+=(signPlugin); fi
          ./gradlew --no-daemon --console=plain "${tasks[@]}" -PpluginVersion="$VERSION"
      - if: inputs.dry-run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: axx-intellij-plugin-release-dry-run
          path: |
            ide/intellij/build/distributions/*.zip
            ide/intellij/build/reports/pluginVerifier/
          retention-days: 14

      - if: ${{ !inputs.dry-run && steps.secrets.outputs.publish == 'true' }}
        name: sign and publish
        run: ./gradlew --no-daemon --console=plain publishPlugin -PpluginVersion="$VERSION"
