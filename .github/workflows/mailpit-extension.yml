# SPDX-License-Identifier: Apache-2.0
# Builds and smoke-tests axx's Mailpit image, and publishes ghcr.io/nimbusxr/axx-mailpit:
#   pull requests       -> docker build (which runs the patch's Go tests) and smoke test
#   main                -> also push :edge
#   releases            -> called by release.yml: push :<version>, :<major>.<minor> and :latest
#                          (multi-arch, signed, with provenance)
#   release dry runs    -> called by release.yml: build the multi-arch image, publish nothing
# Nothing is pushed unless the AXX_PUBLISH repository variable is "true".
name: mailpit-extension

on:
  pull_request:
    paths:
      - extensions/mailpit-chaos/**
      - .github/workflows/mailpit-extension.yml
  push:
    branches: [main]
    paths:
      - extensions/mailpit-chaos/**
      - .github/workflows/mailpit-extension.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: release tag to build (mailpit-chaos-v<version>)
        type: string
        required: true
      version:
        description: released version, e.g. 0.1.0
        type: string
        required: true
      dry-run:
        description: build everything a release would publish, and publish nothing
        type: boolean
        default: false

permissions:
  contents: read

# Runs called from release.yml (with a version) get a group of their own, so they never cancel
# or wait on this workflow's own run for the same ref.
concurrency:
  group: mailpit-extension-${{ github.ref }}-${{ inputs.version || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/nimbusxr/axx-mailpit

defaults:
  run:
    working-directory: extensions/mailpit-chaos

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: extensions/mailpit-chaos
          load: true
          tags: axx-mailpit:ci
          cache-from: type=gha,scope=axx-mailpit
          # Layers are cached from main only: pull requests read them.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=axx-mailpit' || '' }}
      - run: ./smoke-test.sh axx-mailpit:ci

  publish:
    if: inputs.dry-run || (vars.AXX_PUBLISH == 'true' && (github.event_name == 'push' || inputs.version != ''))
    needs: [image]
    runs-on: ubuntu-24.04
    # A release publishes from the release environment (main only).
    environment: ${{ inputs.version != '' && !inputs.dry-run && 'release' || '' }}
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - if: ${{ !inputs.dry-run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main,enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=axx-mailpit
            org.opencontainers.image.description=Mailpit with axx's chaos rules, which refuse the mail of particular senders or recipients
            org.opencontainers.image.licenses=MIT AND Apache-2.0
            org.opencontainers.image.vendor=NimbusXR
          annotations: |
            org.opencontainers.image.title=axx-mailpit
            org.opencontainers.image.description=Mailpit with axx's chaos rules, which refuse the mail of particular senders or recipients
            org.opencontainers.image.licenses=MIT AND Apache-2.0
            org.opencontainers.image.vendor=NimbusXR
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: extensions/mailpit-chaos
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry-run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          # Only a dry run reuses cached layers; a published image is built from scratch.
          cache-from: ${{ inputs.dry-run && 'type=gha,scope=axx-mailpit' || '' }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=axx-mailpit' || '' }}
      - name: sign (cosign keyless)
        if: ${{ !inputs.dry-run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
