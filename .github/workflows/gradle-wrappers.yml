# The Gradle wrappers' jars (the couriers' Android app, the IntelliJ plugin, the WireMock
# extension), checked against Gradle's published checksums. It runs on every push to main, so
# that main's latest commit always has a passing run: OpenSSF Scorecard counts a wrapper's jar as
# a checked-in binary unless it does. A pull request that changes a wrapper runs it too.
name: gradle-wrappers

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/gradle/wrapper/**"
      - .github/workflows/gradle-wrappers.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
