# SPDX-License-Identifier: Apache-2.0
# release-please keeps one release PR per component. Merging it tags the release, and
# the jobs below publish exactly the components that were released. Publishing lives
# here (not in tag-triggered workflows) so it never depends on whether a tag created
# through the API starts other workflows.
#
# Nothing is published unless the AXX_PUBLISH repository variable is "true". Until then,
# and always for pull requests and manual runs, this is a dry run: release-please reports
# the release PR it would open, and every component is built and checked as a release
# would build it, then attached to the run instead of published.
name: release

on:
  push:
    branches: [main]
  # A dry run for a pull request that changes how releases are made. Not for the release PR,
  # which changes only versions and the changelog (.release-please-manifest.json): what it
  # releases is what CI tested, and merging it builds the release for real.
  pull_request:
    paths:
      - .goreleaser.yaml
      - build/**
      - release-please-config.json
      - scripts/release-check.sh
      - .github/workflows/release.yml
      - .github/workflows/wiremock-extension.yml
      - .github/workflows/intellij-plugin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # Publishing reads the release app's key from the release-pr environment (main only). A dry
    # run uses no environment.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AXX_PUBLISH == 'true' && 'release-pr' || '' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dry-run: ${{ steps.mode.outputs.dry-run }}
      axx: ${{ steps.rp.outputs.release_created || steps.dry.outputs.axx }}
      axx_tag: ${{ steps.rp.outputs.tag_name }}
      wiremock: ${{ steps.rp.outputs['extensions/wiremock-openapi--release_created'] || steps.dry.outputs.wiremock }}
      wiremock_tag: ${{ steps.rp.outputs['extensions/wiremock-openapi--tag_name'] }}
      wiremock_version: ${{ steps.rp.outputs['extensions/wiremock-openapi--version'] || steps.dry.outputs.wiremock_version }}
      intellij: ${{ steps.rp.outputs['ide/intellij--release_created'] || steps.dry.outputs.intellij }}
      intellij_tag: ${{ steps.rp.outputs['ide/intellij--tag_name'] }}
      intellij_version: ${{ steps.rp.outputs['ide/intellij--version'] || steps.dry.outputs.intellij_version }}
    steps:
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUBLISH: ${{ vars.AXX_PUBLISH }}
        run: |
          if [[ "$EVENT" == push && "$REF" == refs/heads/main && "$PUBLISH" == true ]]; then
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry-run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run: nothing is published. Releases from main need the AXX_PUBLISH repository variable set to true."
          fi

      # Publishing. A GitHub App token (not GITHUB_TOKEN) so the release PR triggers CI.
      - if: steps.mode.outputs.dry-run == 'false'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Only what release-please needs: release PRs, labels, tags and releases.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - if: steps.mode.outputs.dry-run == 'false'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Dry run: the release PR release-please would open, read-only, and every component
      # built at the version its next release would get.
      - if: steps.mode.outputs.dry-run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - if: steps.mode.outputs.dry-run == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "node"
          cache: false # this job also publishes
      - if: steps.mode.outputs.dry-run == 'true'
        name: release-please (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          out=$(mktemp)
          status=0
          npx -y release-please@17.11.2 release-pr --dry-run --token "$GH_TOKEN" --repo-url "$REPO" \
            --target-branch main --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json >"$out" 2>&1 || status=$?
          cat "$out"
          {
            echo "### release-please (dry run)"
            echo
            echo "What release-please would do on \`main\` (it reads the branch on GitHub, not this checkout):"
            echo
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: steps.mode.outputs.dry-run == 'true'
        id: dry
        run: |
          version() { jq -r --arg p "$1" '.packages[$p]["release-as"] // "0.0.0-dry-run"' release-please-config.json; }
          {
            echo "axx=true"
            echo "wiremock=true"
            echo "wiremock_version=$(version extensions/wiremock-openapi)"
            echo "intellij=true"
            echo "intellij_version=$(version ide/intellij)"
          } >> "$GITHUB_OUTPUT"

  docs:
    # The site's root is the latest release's docs: a new release asks for a docs run, which
    # builds them from its tag (docs.yml). A run started with this token is one GitHub allows.
    needs: release-please
    if: needs.release-please.outputs.dry-run == 'false' && needs.release-please.outputs.axx == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

  # axx's macOS launcher (ADR 0016): axx.app, signed with NimbusXR's Developer ID and sent to
  # Apple's notary service, on the release beside the CLI's archives, where axx downloads it.
  macos-launcher:
    needs: release-please
    if: needs.release-please.outputs.dry-run == 'false' && needs.release-please.outputs.axx == 'true'
    runs-on: macos-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.axx_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-please.outputs.axx_tag }}
          persist-credentials: false
      # No cache in a job that publishes.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          cache: false
      - id: apple
        uses: ./.github/actions/apple-signing
        with:
          certificate: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY_P8 }}
      # Apple notarizes it within minutes, as a rule: a job that waits no more than 6 leaves one
      # it has not, signed, for the notarized job to wait for.
      - name: axx.app, signed and notarized
        run: scripts/macos-launcher-app.sh "$RUNNER_TEMP/launcher" "${TAG#v}"
        env:
          AXX_SIGN_IDENTITY: ${{ steps.apple.outputs.identity }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.key-path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          AXX_NOTARIZE_TIMEOUT: 6m
      - id: zip
        run: |
          zip="$RUNNER_TEMP/axx-launcher_${TAG#v}_darwin.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/launcher/axx.app" "$zip"
          echo "path=$zip" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.zip.outputs.path }}
      - run: gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}
      - if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # The CLI: binaries, archives, checksums, SBOMs, signatures, images, Homebrew cask.
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.dry-run == 'false' && needs.release-please.outputs.axx == 'true'
    runs-on: ubuntu-24.04
    # The release environment: main only. Merging the release PR is the approval.
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-please.outputs.axx_tag }}
          fetch-depth: 0
          persist-credentials: false
      # The Homebrew tap is another repository; the release app writes the cask there.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: tap
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: nimbusxr
          repositories: homebrew-tap
          permission-contents: write
      # No cache in a job that publishes: a restored cache could feed the release.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go goreleaser"
          cache: false
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      # Docker Hub's images (the builder's own among them) through Google's mirror.
      - uses: ./.github/actions/docker-hub-mirror
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The macOS binaries are signed and sent to Apple's notary service (.goreleaser.yaml).
      - id: apple
        uses: ./.github/actions/apple-signing
        with:
          api-key: ${{ secrets.APPLE_API_KEY_P8 }}
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.release-please.outputs.axx_tag }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.key-path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: dist/checksums.txt

  # Apple's answer for everything the release sent it (ADR 0016): the launcher and the macOS
  # binaries. It fails on a refusal; Apple still at it after 8 minutes is a warning.
  notarized:
    needs: [release-please, macos-launcher, goreleaser]
    if: needs.release-please.outputs.dry-run == 'false' && needs.release-please.outputs.axx == 'true'
    runs-on: macos-latest
    environment: release
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-please.outputs.axx_tag }}
          persist-credentials: false
      - id: apple
        uses: ./.github/actions/apple-signing
        with:
          api-key: ${{ secrets.APPLE_API_KEY_P8 }}
      - name: Apple notarized them
        run: scripts/notarized.sh "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)" 8
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.key-path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  # The same build in snapshot mode: nothing is pushed, uploaded or signed (keyless signing
  # would write to the public transparency log). scripts/release-check.sh checks the result.
  goreleaser-dry-run:
    needs: release-please
    if: needs.release-please.outputs.dry-run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go goreleaser"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # A dry run publishes nothing, so it can reuse CI's cross-build cache.
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      # Docker Hub's images (the builder's own among them) through Google's mirror.
      - uses: ./.github/actions/docker-hub-mirror
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: GORELEASER_CURRENT_TAG=$(scripts/cli-tag.sh) goreleaser release --snapshot --clean --skip=sign
      - run: scripts/release-check.sh dist
        env:
          RELEASE_CHECK_STRICT: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: axx-release-dry-run
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            dist/homebrew/
            dist/metadata.json
          retention-days: 14

  # ghcr.io/nimbusxr/axx-wiremock:<version>, :<major>.<minor> and :latest, plus the fat jar
  # attached to the release. A dry run builds both without publishing.
  wiremock-openapi:
    needs: release-please
    if: needs.release-please.outputs.wiremock == 'true'
    permissions:
      contents: write # the jar release asset
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/wiremock-extension.yml
    with:
      tag: ${{ needs.release-please.outputs.wiremock_tag }}
      version: ${{ needs.release-please.outputs.wiremock_version }}
      dry-run: ${{ needs.release-please.outputs.dry-run == 'true' }}

  # The axx IntelliJ plugin on the JetBrains Marketplace. A dry run verifies it without
  # uploading.
  intellij:
    needs: release-please
    if: needs.release-please.outputs.intellij == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/intellij-plugin.yml
    with:
      tag: ${{ needs.release-please.outputs.intellij_tag }}
      version: ${{ needs.release-please.outputs.intellij_version }}
      dry-run: ${{ needs.release-please.outputs.dry-run == 'true' }}
    secrets:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
