# SPDX-License-Identifier: Apache-2.0
# Builds and tests the VS Code extension (ide/vscode) on pull requests and main.
# It never publishes: release.yml's vscode job does, for a vscode-v<version> release.
name: vscode-extension

on:
  pull_request:
    paths:
      - ide/vscode/**
      - schemas/**
      - .github/workflows/vscode-extension.yml
  push:
    branches: [main]
    paths:
      - ide/vscode/**
      - schemas/**
      - .github/workflows/vscode-extension.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: ide/vscode

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "node"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package
