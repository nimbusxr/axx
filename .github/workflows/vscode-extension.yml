# SPDX-License-Identifier: Apache-2.0
# Builds and tests the VS Code extension (ide/vscode) on pull requests and main.
# It never publishes.
name: vscode-extension

on:
  pull_request:
    paths:
      - ide/vscode/**
      - .github/workflows/vscode-extension.yml
  push:
    branches: [main]
    paths:
      - ide/vscode/**
      - .github/workflows/vscode-extension.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: ide/vscode

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "node"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package
