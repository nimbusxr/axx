name: ci

on:
  pull_request:
  # What reaches main passed its pull request (and the merge queue), so a push to main tests
  # nothing. It runs only when it changes what the caches pull requests read are made from: then
  # its jobs refresh those caches, and do nothing else.
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - .mise.toml
      # web-tools: the browsers, axe-core and Lighthouse axx prepares
      - packs/web/internal/driver/**
      - packs/web/lighthouse/**
      - packs/web/a11y/a11y.go
      - internal/npm/node.go
      # Gradle's caches (the couriers' Android app) and the WireMock image's layers
      - examples/**/*.gradle.kts
      - examples/**/gradle/**
      - examples/**/gradle.properties
      - extensions/wiremock-openapi/**
      # the cache keys
      - .github/actions/**
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a run needs (scripts/ci-changes.sh). A pull request runs the jobs for the files it
  # changes, and a change to CI itself runs every job. The merge queue runs none when a passing
  # run of the pull request tested the very same tree, which it did unless main moved since
  # (scripts/ci-tested.sh); then it runs the pull request's jobs on the new main. A push to main
  # runs no tests (tests is false): it refreshes the caches pull requests read, and the caches
  # job keeps the newest of each.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the pull request's passing runs, for the merge queue
      pull-requests: read # the queued pull request's head
    outputs:
      go: ${{ steps.changes.outputs.go }}
      integration: ${{ steps.changes.outputs.integration }}
      web: ${{ steps.changes.outputs.web }}
      mobile: ${{ steps.changes.outputs.mobile }}
      desktop: ${{ steps.changes.outputs.desktop }}
      examples: ${{ steps.changes.outputs.examples }}
      acceptance: ${{ steps.changes.outputs.acceptance }}
      workflows: ${{ steps.changes.outputs.workflows }}
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      # A pull request is checked out as its merge into the base branch, and the merge queue's
      # group as its commit on top of it: the first parent differs by what they change.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          QUEUED: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = merge_group ] && scripts/ci-tested.sh "$QUEUED"; then
            scripts/ci-changes.sh --none
          elif [ "$EVENT" != push ] && files=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$files" | scripts/ci-changes.sh
          else
            scripts/ci-changes.sh --all
          fi | tee -a "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ]; then echo tests=false; else echo tests=true; fi | tee -a "$GITHUB_OUTPUT"
      # The tree the pull request's run tests, for the merge queue to know it.
      - if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tested-tree
          path: ${{ runner.temp }}/tested-tree
          retention-days: 30

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:gitleaks/gitleaks"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: scripts/hygiene.sh
      - name: gitleaks (history)
        run: gitleaks git --no-banner --redact .

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go golangci-lint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: lint
          extra-paths: ~/.cache/golangci-lint
      - run: go mod tidy -diff
      - name: generated files are up to date
        run: |
          go generate ./...
          # untracked files count too (a newly generated page must be committed)
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: golangci-lint run
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # This job keeps Linux's module cache (see .github/actions/go-cache).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: lint
          mode: save
          extra-paths: ~/.cache/golangci-lint

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows scans every file the checkout, the cache restore and the build write, which
      # makes them slow: its real-time scanning is off on this runner, which lasts one job.
      - if: runner.os == 'Windows'
        name: stop Windows Defender's real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      # And its D: drive, where the runner's temporary folder is, writes Go's many small cache
      # files much faster than C:, where Go keeps them.
      - if: runner.os == 'Windows'
        name: "Go's caches on the D: drive"
        shell: pwsh
        run: |
          "GOCACHE=$env:RUNNER_TEMP\go-build" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP\go-mod" >> $env:GITHUB_ENV
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - if: needs.changes.outputs.tests == 'true'
        run: scripts/gotest.sh -race ./...
        shell: bash
      # On main, the tests are only built: their build cache is what pull requests read.
      - if: needs.changes.outputs.tests != 'true'
        run: go test -race -run '^$' ./...
        shell: bash
      # On macOS and Windows this job keeps the module cache too (lint does on Linux).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: test
          mode: save
          modules: ${{ runner.os != 'Linux' }}

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    # Packs against real services (PostgreSQL, MongoDB, Kafka, WireMock, the cloud emulators)
    # via testcontainers. It keeps a build cache of its own: the packs' test builds, and the
    # builds of axx with packs that internal/packbuild's tests make.
    runs-on: ubuntu-24.04
    steps:
      # The services' images and the race-detector builds need more disk than a runner has
      # free: remove toolchains the job never uses, in the background while the job sets up.
      - name: free disk space (in the background)
        run: (sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift; touch "$RUNNER_TEMP/disk-freed") > /dev/null 2>&1 &
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Docker Hub's images through Google's mirror: Docker Hub refuses the runners at times.
      - uses: ./.github/actions/docker-hub-mirror
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: integration
      # The web and mobile packs have jobs of their own (web, mobile). The tests are built
      # while the disk space is freed.
      - name: the tests, built
        run: |
          mapfile -t packs < <(go list ./packs/... | grep -v -e /packs/web -e /packs/mobile)
          echo "${packs[@]}" ./internal/engine/... ./internal/packbuild/... > "$RUNNER_TEMP/packages"
          go test -race -tags integration -run '^$' "${packs[@]}" ./internal/engine/... ./internal/packbuild/...
      - name: wait for the disk space
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/disk-freed" ] && break; sleep 2; done
          [ -f "$RUNNER_TEMP/disk-freed" ] || { echo "::error::the disk space was not freed within 10 minutes"; exit 1; }
          df -h /
      - if: needs.changes.outputs.tests == 'true'
        run: |
          read -ra packages < "$RUNNER_TEMP/packages"
          GOTEST_SLOWEST=1s scripts/gotest.sh -race -tags integration -timeout 20m "${packages[@]}"
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: integration
          mode: save
          modules: "false"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # The web packs in Chromium, Firefox and WebKit, which they download on first use; the
    # watching test opens browser windows, on a virtual screen. web-core's tests are two jobs,
    # by their names, the other web packs a third, and the Lighthouse audits a fourth: a score
    # measures the machine's load too, and other packages' browsers would take its CPU.
    name: web (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # On main, only the part that keeps the browsers' cache.
        part: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '["core-a-g", "core-h-z", "packs", "lighthouse"]' || '["packs"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - uses: ./.github/actions/web-tools
      - if: matrix.part == 'core-a-g'
        name: web-core's tests are all in one of its halves
        run: |
          list() { go test -tags integration -list "$1" ./packs/web/core | grep -cE '^(Test|Example|Fuzz)'; }
          all=$(list '.*') a=$(list '^Test[A-G]') b=$(list '^Test[H-Z]')
          [ "$all" -eq $((a + b)) ] || { echo "::error::$((all - a - b)) of web-core's tests are in neither half: name each Test and a capital letter"; exit 1; }
      - if: matrix.part == 'core-a-g'
        run: xvfb-run -a scripts/gotest.sh -race -tags integration -timeout 20m -run '^Test[A-G]' ./packs/web/core
      - if: matrix.part == 'core-h-z'
        run: xvfb-run -a scripts/gotest.sh -race -tags integration -timeout 20m -run '^Test[H-Z]' ./packs/web/core
      - if: matrix.part == 'packs'
        run: |
          mapfile -t packs < <(go list ./packs/web/... | grep -v -e /packs/web/lighthouse -e '/packs/web/core$')
          xvfb-run -a scripts/gotest.sh -race -tags integration -timeout 20m "${packs[@]}"
      - if: matrix.part == 'lighthouse'
        run: xvfb-run -a scripts/gotest.sh -race -tags integration -timeout 20m ./packs/web/lighthouse/...
      - if: ${{ !cancelled() && matrix.part == 'packs' }}
        uses: ./.github/actions/web-tools
        with:
          mode: save

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    # The mobile packs' tests, on an Android emulator that axx starts (KVM). The iOS pack's
    # skip here: they run in the ios job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: KVM, for the emulator, and where its devices are
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # avdmanager would go by the runner's XDG_CONFIG_HOME, and the emulator not.
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      # Gradle's caches: written on main only (the action's default), read by pull requests.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # The couriers' app, while the rest sets up: nothing needs it before the tests.
      - name: the couriers' app (in the background)
        working-directory: examples/parcels/courier/android
        run: (./gradlew --no-daemon --console=plain assembleDebug > "$RUNNER_TEMP/app.log" 2>&1; echo $? > "$RUNNER_TEMP/app.done") &
      # The emulator's device and its boot snapshot, while the rest sets up.
      - if: needs.changes.outputs.tests == 'true'
        name: the emulator's device (in the background)
        working-directory: examples/parcels/courier/android
        run: (./create-emulator.sh > "$RUNNER_TEMP/device.log" 2>&1; echo $? > "$RUNNER_TEMP/device.done") &
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: acceptance
      - name: the tests, built
        run: go test -race -tags integration -run '^$' ./packs/mobile/...
      - name: wait for the couriers' app
        run: |
          for _ in $(seq 450); do [ -f "$RUNNER_TEMP/app.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/app.log"
          [ "$(cat "$RUNNER_TEMP/app.done" 2> /dev/null)" = 0 ] || { echo "::error::the couriers' app was not built"; exit 1; }
      - if: needs.changes.outputs.tests == 'true'
        name: wait for the emulator's device
        run: |
          for _ in $(seq 450); do [ -f "$RUNNER_TEMP/device.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/device.log"
          [ "$(cat "$RUNNER_TEMP/device.done" 2> /dev/null)" = 0 ] || { echo "::error::the emulator's device was not made"; exit 1; }
      - if: needs.changes.outputs.tests == 'true'
        run: GOTEST_SLOWEST=1s scripts/gotest.sh -race -tags integration -timeout 20m ./packs/mobile/...

  android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && needs.changes.outputs.tests == 'true'
    # The parcels example's Android scenarios, on an emulator axx starts (KVM), against the
    # whole example, which axx starts too. They run on two runners, a feature each: one emulator
    # runs one scenario at a time.
    name: android (${{ matrix.feature }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: [courier-app, courier-app-documents, courier-app-notifications]
    steps:
      # The example's images need more disk than a runner has free: remove toolchains the job
      # never uses (not the Android SDK), in the background while the job sets up.
      - name: free disk space (in the background)
        run: (sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift; touch "$RUNNER_TEMP/disk-freed") > /dev/null 2>&1 &
      - name: KVM, for the emulator, and where its devices are
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # avdmanager would go by the runner's XDG_CONFIG_HOME, and the emulator not.
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Docker Hub's images through Google's mirror: Docker Hub refuses the runners at times.
      - uses: ./.github/actions/docker-hub-mirror
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      # Gradle's caches: written on main only (the action's default), read by pull requests.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # The couriers' app, while the rest sets up: nothing needs it before the tests.
      - name: the couriers' app (in the background)
        working-directory: examples/parcels/courier/android
        run: (./gradlew --no-daemon --console=plain assembleDebug > "$RUNNER_TEMP/app.log" 2>&1; echo $? > "$RUNNER_TEMP/app.done") &
      # The emulator's device and its boot snapshot, while the rest sets up.
      - name: the emulator's device (in the background)
        working-directory: examples/parcels/courier/android
        run: (./create-emulator.sh > "$RUNNER_TEMP/device.log" 2>&1; echo $? > "$RUNNER_TEMP/device.done") &
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: acceptance
      - name: wait for the disk space
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/disk-freed" ] && break; sleep 2; done
          [ -f "$RUNNER_TEMP/disk-freed" ] || { echo "::error::the disk space was not freed within 10 minutes"; exit 1; }
          df -h /
      # What the example pulls (2 GB), while the job goes on.
      - name: the example's images (in the background)
        run: (docker compose -f examples/parcels/infra/compose.yaml pull --ignore-buildable --quiet > "$RUNNER_TEMP/pull.log" 2>&1; echo $? > "$RUNNER_TEMP/pull.done") &
      - name: axx, with every pack
        run: |
          go build -o "$RUNNER_TEMP/bin/axx" ./internal/tools/axxall
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: the fixtures, as a fresh clone has them
        working-directory: examples/parcels/acceptance
        run: |
          axx fixtures check
          axx fixtures generate
      # The images the example's compose file builds: in seconds, not minutes.
      - uses: ./.github/actions/parcels-images
      - name: wait for the couriers' app
        run: |
          for _ in $(seq 450); do [ -f "$RUNNER_TEMP/app.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/app.log"
          [ "$(cat "$RUNNER_TEMP/app.done" 2> /dev/null)" = 0 ] || { echo "::error::the couriers' app was not built"; exit 1; }
      - name: wait for the emulator's device
        run: |
          for _ in $(seq 450); do [ -f "$RUNNER_TEMP/device.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/device.log"
          [ "$(cat "$RUNNER_TEMP/device.done" 2> /dev/null)" = 0 ] || { echo "::error::the emulator's device was not made"; exit 1; }
      - name: wait for the example's images
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/pull.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/pull.log"
          # A pull that failed is done again as the example starts.
          [ "$(cat "$RUNNER_TEMP/pull.done" 2> /dev/null)" = 0 ] || echo "::warning::the example's images were not all pulled"
      - if: matrix.feature == 'courier-app'
        name: every Android feature runs on one of the runners
        working-directory: examples/parcels/acceptance
        run: |
          android=$(grep -rl --include='*.feature' '@android' features | sort | tr '\n' ' ')
          [ "$android" = "features/courier-app-documents/courier-app-documents-android.feature features/courier-app-notifications/courier-app-notifications-android.feature features/courier-app/courier-app-android.feature " ] || { echo "::error::the android job runs courier-app, courier-app-documents and courier-app-notifications, and the Android features are: $android"; exit 1; }
      - working-directory: examples/parcels/acceptance
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          axx run --tags @android --format progress --format junit:build/axx/junit.xml --format html:build/axx/report.html \
            --set packs.mobile-core.traces=failed --set packs.mobile-core.videos=failed "features/$FEATURE/$FEATURE-android.feature"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-${{ matrix.feature }}
          # The report, and the traces, videos, screenshots and the emulators' logs a failure
          # leaves.
          path: |
            examples/parcels/acceptance/build/axx/
            examples/parcels/acceptance/.axx/mobile/
            examples/parcels/acceptance/.axx/logs/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && needs.changes.outputs.tests == 'true'
    # The iOS pack, on simulators axx makes, with the parcels example's couriers' iOS app. The
    # example's iOS scenarios need the whole example, and macOS runners have no Docker: they
    # run on developers' Macs.
    # The tests run on two runners, a simulator each, in about the same time: TestCouriersOnASimulator,
    # two scenarios long, and TestRecordingsOnASimulator on one (232 s and 208 s), the others on
    # the other (456 s).
    name: ios (${{ matrix.tests }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - tests: couriers
            select: -run=^(TestCouriersOnASimulator|TestRecordingsOnASimulator)$
          - tests: others
            select: -skip=^(TestCouriersOnASimulator|TestRecordingsOnASimulator)$
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The runner's Spotlight would index all the job writes (the restored Go caches, the simulator's
      # data) and its software update look for updates, each taking a share of three cores that the
      # simulator and the tests need. And a simulator copies all its processes log to the Mac's log,
      # through a socket of the Mac's diagnosticd: the two diagnosticds took 415 s of processor time
      # in one job. Without that socket the simulator keeps its log to itself (simctl spawn's log
      # show reads it); on a VM of this runner's size the diagnosticds took 10 s rather than 53.
      - name: the Mac's indexing, updates and copies of simulators' logs, off
        run: |
          sudo mdutil -a -i off > /dev/null
          sudo softwareupdate --schedule off > /dev/null
          sudo mv /private/var/run/.sim_diagnosticd_socket /private/var/run/.sim_diagnosticd_socket.off ||
            echo "::warning::no socket for simulators' logs: the simulator copies its log to the Mac's"
      # How busy the Mac is while the job runs, the simulator's first boot included: every 30
      # seconds, its load and the processes busiest then (the simulator's processes are the Mac's,
      # marked as the simulator's). The job's last step prints it, and the processes that took the
      # most time.
      - name: the Mac's load (in the background)
        run: |
          (while :; do
            echo "$(date +%T) load $(sysctl -n vm.loadavg)"
            ps -A -o %cpu=,ucomm=,command= -r | head -8 | awk '{ printf "%6s %s%s\n", $1, $2, index($0, "CoreSimulator") ? " (simulator)" : "" }'
            sleep 30
          done > "$RUNNER_TEMP/load.log" 2>&1) &
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Only the module cache: the tests build without the race detector, and the test build cache
      # was built with it.
      - uses: ./.github/actions/go-cache
      # The simulator the tests keep, made and booted while the job builds the app and the tests:
      # its first boot takes minutes on these runners (scripts/ios-simulator.sh). Not before the
      # caches are restored: alongside the first boot, writing them took fifty times as long
      # (218 s for the tools' 103 MB, against 4 s in the test job, on the same image).
      - name: the tests' simulator (in the background)
        run: (scripts/ios-simulator.sh > "$RUNNER_TEMP/simulator.log" 2>&1; echo $? > "$RUNNER_TEMP/simulator.done") &
      - name: the couriers' app
        working-directory: examples/parcels/courier/ios
        run: xcodebuild -project Courier.xcodeproj -target Courier -configuration Debug -sdk iphonesimulator ONLY_ACTIVE_ARCH=NO SYMROOT=build
      - name: the tests, built
        run: go test -tags integration -run '^$' ./packs/mobile/ios/...
      - name: wait for the tests' simulator
        run: |
          for _ in $(seq 450); do [ -f "$RUNNER_TEMP/simulator.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/simulator.log"
          [ "$(cat "$RUNNER_TEMP/simulator.done" 2> /dev/null)" = 0 ] || { echo "::error::the tests' simulator did not boot"; exit 1; }
      # The tests share that simulator, kept booted from one to the next, as a run's worker has
      # one. Each prints the packs' log (how long the simulator took to get ready, and each
      # part), and a failed one the end of its logs and the screen it read. Without the race
      # detector: on three cores it doubled the tests' time (783 s against 405 s, measured on a VM
      # of this runner's size), and the Android jobs run the shared mobile code with it.
      - env:
          SELECT: ${{ matrix.select }}
        run: GOTEST_FORMAT=standard-verbose GOTEST_SLOWEST=1s scripts/gotest.sh -tags integration -timeout 45m "$SELECT" ./packs/mobile/ios/...
      - name: the Mac's load
        if: always()
        run: |
          cat "$RUNNER_TEMP/load.log"
          echo "the processes that took the most processor time:"
          ps -A -o time=,ucomm=,command= | awk '{ n = split($1, t, ":"); s = 0; for (i = 1; i <= n; i++) s = s * 60 + t[i]; printf "%8.0f s  %s%s\n", s, $2, index($0, "CoreSimulator") ? " (simulator)" : "" }' | sort -rn | head -30

  desktop-image:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # The image the depot desk's Linux builds run in (examples/parcels/depot-desk/linux), built
    # once for each version of its Dockerfile and kept in the registry: every run, and every
    # developer, uses the same libraries, which draw the same pixels as the screenshots kept.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Docker Hub's images through Google's mirror: Docker Hub refuses the runners at times.
      - uses: ./.github/actions/docker-hub-mirror
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          tag=$(cat examples/parcels/depot-desk/linux/Dockerfile examples/parcels/depot-desk/linux/run.sh | sha256sum | cut -c1-16)
          echo "image=ghcr.io/$OWNER/axx-depot-desk:$tag" >> "$GITHUB_OUTPUT"
      - name: the image, unless the registry has it
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is in the registry"
          else
            docker build -t "$IMAGE" examples/parcels/depot-desk/linux
            docker push "$IMAGE"
          fi

  desktop:
    needs: [changes, desktop-image]
    if: needs.changes.outputs.desktop == 'true'
    # The depot desk's feature (examples/parcels/depot-desk) with axx, against each Linux build of
    # the desk, on X11 and, in a GNOME session of its own, on Wayland: the baseline that keeps every
    # toolkit working. It runs in the desk's image, which draws what the screenshots kept show. The
    # macOS and Windows builds run on developers' machines. A failure leaves its report, the
    # traces and the screenshots the run took.
    name: desktop (${{ matrix.build }}, ${{ matrix.display }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # On main, only the entry that keeps the build cache.
        build: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '["gtk3", "gtk4", "qt6", "qt5", "swing", "electron", "tauri", "flutter"]' || '["gtk3"]') }}
        display: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '["x11", "wayland"]' || '["x11"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: desktop
      - name: axx, with every pack
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/axx" ./internal/tools/axxall
      - if: needs.changes.outputs.tests == 'true'
        name: the depot desk's feature, in its image
        env:
          IMAGE: ${{ needs.desktop-image.outputs.image }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ matrix.build }}
          DISPLAY_SERVER: ${{ matrix.display }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          mkdir -p "$RUNNER_TEMP/out"
          # GNOME Shell takes /run/systemd/seats for logind's, which a container has not.
          docker run --rm --shm-size=1g --tmpfs /run/systemd \
            -v "$PWD/examples/parcels/depot-desk:/src:ro" -v "$RUNNER_TEMP/axx:/usr/local/bin/axx:ro" -v "$RUNNER_TEMP/out:/out" \
            "$IMAGE" depot-desk "$BUILD" "$DISPLAY_SERVER" --format progress --format junit:/out/junit.xml \
            --format html:/out/report.html --set packs.desktop-core.traces=failed
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.build }}-${{ matrix.display }}
          # Not the apps' homes in .axx: the container wrote them, some unreadable here.
          path: |
            ${{ runner.temp }}/out/*.xml
            ${{ runner.temp }}/out/*.html
            ${{ runner.temp }}/out/screenshots/
            ${{ runner.temp }}/out/.axx/desktop/traces/
            ${{ runner.temp }}/out/.axx/desktop/videos/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() && matrix.build == 'gtk3' && matrix.display == 'x11' }}
        uses: ./.github/actions/go-cache
        with:
          build: desktop
          mode: save

  cross-build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # CGO_ENABLED=0 must keep working for every release target. Built with -trimpath like
    # GoReleaser, so release-check and the release dry run reuse this job's build cache.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/axx
          done
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: cross
          mode: save
          modules: "false"

  example-app:
    needs: changes
    if: needs.changes.outputs.examples == 'true' && needs.changes.outputs.tests == 'true'
    # The services the examples test are Go modules of their own.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [parcels, parcel-claims, carrier-billing, customs-clearance]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go golangci-lint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: go mod tidy -diff
      - run: go test ./...
      - run: golangci-lint run

  acceptance:
    needs: changes
    if: needs.changes.outputs.acceptance == 'true'
    # Each example's acceptance suite, the way its README runs it: axx starts the service and
    # its infrastructure with Docker Compose, runs the features and removes everything. axx is
    # built with every pack, so it prepares none.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # On main, only parcels, whose job keeps the caches.
        example: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '["parcels", "parcel-claims", "carrier-billing", "customs-clearance"]' || '["parcels"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Docker Hub's images through Google's mirror: Docker Hub refuses the runners at times.
      - uses: ./.github/actions/docker-hub-mirror
      # What the parcels example pulls (2 GB), while the job sets up.
      - if: matrix.example == 'parcels' && needs.changes.outputs.tests == 'true'
        name: the example's images (in the background)
        run: (docker compose -f examples/parcels/infra/compose.yaml pull --ignore-buildable --quiet > "$RUNNER_TEMP/pull.log" 2>&1; echo $? > "$RUNNER_TEMP/pull.done") &
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: acceptance
      - name: axx, with every pack
        run: |
          go build -o "$RUNNER_TEMP/bin/axx" ./internal/tools/axxall
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The parcels shop portal's features run in browsers.
      - if: matrix.example == 'parcels' && needs.changes.outputs.tests == 'true'
        uses: ./.github/actions/web-tools
      # The images parcels' compose file builds: in seconds, not minutes.
      - if: matrix.example == 'parcels'
        uses: ./.github/actions/parcels-images
      - if: needs.changes.outputs.tests == 'true'
        name: the fixtures, as a fresh clone has them
        working-directory: examples/${{ matrix.example }}/acceptance
        run: |
          axx fixtures check
          axx fixtures generate
      - if: matrix.example == 'parcels' && needs.changes.outputs.tests == 'true'
        name: wait for the example's images
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/pull.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/pull.log"
          # A pull that failed is done again as the example starts.
          [ "$(cat "$RUNNER_TEMP/pull.done" 2> /dev/null)" = 0 ] || echo "::warning::the example's images were not all pulled"
      - if: needs.changes.outputs.tests == 'true'
        working-directory: examples/${{ matrix.example }}/acceptance
        # The Android scenarios run in the android job, on an emulator; the iOS ones on Macs.
        run: axx run --tags "not @mobile" --format progress --format junit:build/axx/junit.xml --format html:build/axx/report.html
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-${{ matrix.example }}
          # The report, and the screenshots, traces and logs a failure leaves.
          path: |
            examples/${{ matrix.example }}/acceptance/build/axx/
            examples/${{ matrix.example }}/acceptance/.axx/web/
            examples/${{ matrix.example }}/acceptance/.axx/logs/
          if-no-files-found: ignore
          retention-days: 7
      # How long the example took to build, pull and start, from its log.
      - if: ${{ !cancelled() && matrix.example == 'parcels' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apps-log-parcels
          path: examples/parcels/acceptance/.axx/logs/services.log
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() && matrix.example == 'parcels' }}
        uses: ./.github/actions/go-cache
        with:
          build: acceptance
          mode: save
          modules: "false"

  release-check:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go goreleaser"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: goreleaser check
      - run: GORELEASER_CURRENT_TAG=$(scripts/cli-tag.sh) goreleaser build --snapshot --clean --single-target

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:rhysd/actionlint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: mise exec aqua:rhysd/actionlint -- actionlint
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # Security audit of every workflow (template injection, permissions, pinning...).
      - run: uvx zizmor --offline --min-severity medium --format github .github/workflows

  # A push to main keeps a build cache of its own for each job and OS (go-cache), and GitHub keeps
  # 10 GB of a repository's caches, dropping the least used over that: the browsers' among them,
  # which every web job then downloads again. Main keeps only the newest of each: Go's build
  # caches by job and OS, its module caches and the browsers by OS. (Docker's layers, Gradle's and
  # mise's caches look after their own.)
  caches:
    if: always() && github.event_name == 'push'
    needs: [hygiene, lint, test, integration, web, mobile, desktop, cross-build, acceptance]
    runs-on: ubuntu-24.04
    permissions:
      actions: write # to delete caches
    steps:
      - name: the older caches of each, deleted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list -R "$REPO" --ref refs/heads/main --limit 1000 --json id,key,createdAt --jq '
            map(select(.key | test("^(go-build|go-mod|web-tools)-")) | .family = (.key | sub("(-[0-9a-f]{8,})+$"; "")))
            | group_by(.family) | map(sort_by(.createdAt) | reverse | .[1:][]) | .[] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "deleting $key"
              gh cache delete -R "$REPO" "$id"
            done

  # Single required status check; keeps branch protection simple as jobs are added. A job a
  # pull request does not need is skipped, which passes.
  ci-ok:
    if: always()
    needs: [changes, hygiene, lint, workflows, test, integration, web, mobile, android, ios, desktop-image, desktop, cross-build, example-app, acceptance, release-check]
    runs-on: ubuntu-24.04
    steps:
      - name: all jobs passed
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
