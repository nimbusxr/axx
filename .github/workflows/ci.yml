name: ci

on:
  pull_request:
  # What reaches main passed its pull request (and the merge queue), so a push to main tests
  # nothing. It runs only when it changes what the caches pull requests read are made from: then
  # its jobs refresh those caches, and do nothing else.
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - .mise.toml
      # web-tools: the browsers, axe-core and Lighthouse axx prepares
      - packs/web/internal/driver/**
      - packs/web/lighthouse/**
      - packs/web/a11y/a11y.go
      - internal/npm/node.go
      # Gradle's caches (the couriers' Android app) and the WireMock image's layers
      - examples/**/*.gradle.kts
      - examples/**/gradle/**
      - examples/**/gradle.properties
      - extensions/wiremock-openapi/**
      # the cache keys
      - .github/actions/**
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a run needs (scripts/ci-changes.sh). A pull request runs the jobs for the files it
  # changes, and a change to CI itself runs every job. The merge queue runs none when a passing
  # run of the pull request tested the very same tree, which it did unless main moved since
  # (scripts/ci-tested.sh); then it runs the pull request's jobs on the new main. A push to main
  # runs no tests (tests is false): it refreshes the caches pull requests read, and the caches
  # job keeps the newest of each.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the pull request's passing runs, for the merge queue
      pull-requests: read # the queued pull request's head
    outputs:
      go: ${{ steps.changes.outputs.go }}
      integration: ${{ steps.changes.outputs.integration }}
      web: ${{ steps.changes.outputs.web }}
      mobile: ${{ steps.changes.outputs.mobile }}
      desktop: ${{ steps.changes.outputs.desktop }}
      models: ${{ steps.changes.outputs.models }}
      examples: ${{ steps.changes.outputs.examples }}
      acceptance: ${{ steps.changes.outputs.acceptance }}
      workflows: ${{ steps.changes.outputs.workflows }}
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      # A pull request is checked out as its merge into the base branch, and the merge queue's
      # group as its commit on top of it: the first parent differs by what they change.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          QUEUED: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = merge_group ] && scripts/ci-tested.sh "$QUEUED"; then
            scripts/ci-changes.sh --none
          elif [ "$EVENT" != push ] && files=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$files" | scripts/ci-changes.sh
          else
            scripts/ci-changes.sh --all
          fi | tee -a "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ]; then echo tests=false; else echo tests=true; fi | tee -a "$GITHUB_OUTPUT"
      # The tree the pull request's run tests, for the merge queue to know it.
      - if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tested-tree
          path: ${{ runner.temp }}/tested-tree
          retention-days: 30

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:gitleaks/gitleaks"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: scripts/hygiene.sh
      - name: gitleaks (history)
        run: gitleaks git --no-banner --redact .

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The examples' model files (Git LFS).
      - uses: ./.github/actions/lfs
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go golangci-lint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: lint
          extra-paths: ~/.cache/golangci-lint
      - run: go mod tidy -diff
      # Nothing that builds a model stub fuses a multiply and an add (arm64 would round it
      # otherwise than amd64): stubs are the same bit for bit on every machine.
      - run: scripts/no-fma.sh
      # The examples' module (examples/go.mod), which keeps them out of axx's.
      - run: go mod tidy -diff
        working-directory: examples
      - name: generated files are up to date
        run: |
          go generate ./...
          # untracked files count too (a newly generated page must be committed)
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: golangci-lint run
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # This job keeps Linux's module cache (see .github/actions/go-cache).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: lint
          mode: save
          extra-paths: ~/.cache/golangci-lint

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # The unit tests on each OS, in two parts: the models packs' and the rest (some 5 minutes
    # each on Windows, whose caches and builds are the slowest). On main, where the tests are only
    # built, one part builds them all.
    name: test (${{ matrix.os }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        part: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '["models", "rest"]' || '["all"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # Windows scans every file the checkout, the cache restore and the build write, which
      # makes them slow: its real-time scanning is off on this runner, which lasts one job.
      - if: runner.os == 'Windows'
        name: stop Windows Defender's real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      # And its D: drive, where the runner's temporary folder is, writes Go's many small cache
      # files much faster than C:, where Go keeps them.
      - if: runner.os == 'Windows'
        name: "Go's caches on the D: drive"
        shell: pwsh
        run: |
          "GOCACHE=$env:RUNNER_TEMP\go-build" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP\go-mod" >> $env:GITHUB_ENV
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      # The tests are built in a step of their own, as the integration job's are. On main, they
      # are only built: their build cache is what pull requests read.
      - name: the tests, built
        env:
          PART: ${{ matrix.part }}
        run: |
          # (xargs: macOS's bash, 3.2, has no mapfile.)
          case "$PART" in
            models) go list ./packs/models/... > "$RUNNER_TEMP/packages" ;;
            rest) go list ./... | grep -v '/packs/models/' > "$RUNNER_TEMP/packages" ;;
            *) go list ./... > "$RUNNER_TEMP/packages" ;;
          esac
          xargs go test -race -run '^$' < "$RUNNER_TEMP/packages"
        shell: bash
      - if: needs.changes.outputs.tests == 'true'
        run: xargs scripts/gotest.sh -race < "$RUNNER_TEMP/packages"
        shell: bash
      # On macOS and Windows this job keeps the module cache too (lint does on Linux).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: test
          mode: save
          modules: ${{ runner.os != 'Linux' }}

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    # Packs against real services (PostgreSQL, MongoDB, Kafka, WireMock, the cloud emulators)
    # via testcontainers, and the models packs' stubs in their runtimes. Each part keeps a build
    # cache of its own: its tests' builds, and the builds of axx with packs that
    # internal/packbuild's tests make.
    name: integration (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The models packs' tests in twelve parts, by their formats' names, of 2 to 5 minutes each
        # here, as their times go, after some 2 of setting up (no job runs past 10, on a slow
        # runner either): a format's tests run its runtime, which takes every processor (and
        # spins on it), so their packages run one at a time. ExecuTorch's, GGUF's (llama.cpp)
        # and TorchScript's (PyTorch) have parts of their own; ONNX's, the longest (7.5 minutes),
        # are in two: transformers.js's, and the rest; and safetensors' Whisper transcriptions in
        # transformers (6 minutes) are in two: the English ones, and the rest with the other
        # formats of p to s.
        part: [packs, models-a-d, models-e-f, models-gguf, models-h-k, models-l-m, models-n-o, models-onnx-js, models-p-s, models-safetensors-en, models-t, models-torchscript, models-u-z]
    env:
      PART: ${{ matrix.part }}
    steps:
      # The services' images and the race-detector builds need more disk than a runner of 14 GB
      # free had: on one with less than 40 GB free, remove toolchains the job never uses, in the
      # background while the job sets up. GitHub's runners have 80 GB free now, and removing them
      # took up to two minutes the job then waited on.
      - name: free disk space (in the background)
        run: |
          (if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 40 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          fi; touch "$RUNNER_TEMP/disk-freed") > /dev/null 2>&1 &
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Docker Hub's images through Google's mirror: Docker Hub refuses the runners at times.
      - uses: ./.github/actions/docker-hub-mirror
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go aqua:gotestyourself/gotestsum uv"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: integration-${{ matrix.part }}
      # Tesseract's CLI, and the libraries MediaPipe's library loads (whatever its task).
      - if: matrix.part != 'packs'
        name: install Tesseract and EGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libegl1 libgles2
      # The web and mobile packs have jobs of their own (web, mobile), and the models-web pack's
      # tests run in the web job (its browsers' libraries, a sound server). The tests are built
      # while the disk space is freed.
      - name: the tests, built
        run: |
          models=$(go list ./packs/models/... | grep -v /packs/models/web)
          case "$PART" in
            packs) mapfile -t packages < <(go list ./packs/... ./internal/engine/... ./internal/packbuild/... | grep -v -e /packs/web -e /packs/mobile -e /packs/models/) ;;
            models-a-d) mapfile -t packages < <(grep -v -E '/format/[e-z]' <<< "$models") ;;
            models-e-f) mapfile -t packages < <(grep -E '/format/[e-f]' <<< "$models") ;;
            models-gguf) mapfile -t packages < <(grep -E '/format/gguf$' <<< "$models") ;;
            models-h-k) mapfile -t packages < <(grep -E '/format/[h-k]' <<< "$models") ;;
            models-l-m) mapfile -t packages < <(grep -E '/format/[l-m]' <<< "$models") ;;
            models-n-o) mapfile -t packages < <(grep -E '/format/[n-o]' <<< "$models") ;;
            models-onnx-js) mapfile -t packages < <(grep -E '/format/onnx$' <<< "$models") ;;
            models-p-s) mapfile -t packages < <(grep -E '/format/[p-s]' <<< "$models") ;;
            models-safetensors-en) mapfile -t packages < <(grep -E '/format/safetensors$' <<< "$models") ;;
            models-t) mapfile -t packages < <(grep -E '/format/t' <<< "$models" | grep -v '/format/torchscript$') ;;
            models-torchscript) mapfile -t packages < <(grep -E '/format/torchscript$' <<< "$models") ;;
            models-u-z) mapfile -t packages < <(grep -E '/format/[u-z]' <<< "$models") ;;
          esac
          echo "${packages[@]}" > "$RUNNER_TEMP/packages"
          go test -race -tags integration -run '^$' "${packages[@]}"
      - name: wait for the disk space
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/disk-freed" ] && break; sleep 2; done
          [ -f "$RUNNER_TEMP/disk-freed" ] || { echo "::error::the disk space was not freed within 10 minutes"; exit 1; }
          df -h /
      # WebLLM's stubs run on a GPU, which the runner has not (its WebGPU, SwiftShader's, on its
      # processor, takes hours): the webllm job runs them, on a Mac's.
      - if: needs.changes.outputs.tests == 'true'
        run: |
          read -ra packages < "$RUNNER_TEMP/packages"
          parallel=()
          [ "$PART" = packs ] || parallel=(-p 1)
          # ONNX's transformers.js tests run in a part of their own, and so do safetensors' English
          # Whisper transcriptions.
          case "$PART" in
            models-onnx-js) select=(-run '^TestTransformersJS') ;;
            models-n-o) select=(-skip '^(TestWebLLM|TestTransformersJS)') ;;
            models-safetensors-en) select=(-run '^TestTransformersTranscribesAsTheStubSays$/English') ;;
            models-p-s) select=(-skip '^TestTransformersTranscribesAsTheStubSays$/English') ;;
            *) select=(-skip '^TestWebLLM') ;;
          esac
          GOTEST_SLOWEST=1s scripts/gotest.sh -race -tags integration -timeout 10m "${parallel[@]}" "${select[@]}" "${packages[@]}"
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: integration-${{ matrix.part }}
          mode: save
          modules: "false"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # The web packs in Chromium, Firefox and WebKit, which they download on first use; the
    # watching test opens browser windows, on a virtual screen. web-core's tests are two jobs,
    # by their names, the other web packs a third, and the Lighthouse audits a fourth: a score
    # measures the machine's load too, and other packages' browsers would take its CPU.
    name: web (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # On main, only the part that keeps the browsers' cache.
        part: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '["core-a-g", "core-h-z", "packs", "lighthouse"]' || '["packs"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - uses: ./.github/actions/web-tools
      - if: matrix.part == 'core-a-g'
        name: web-core's tests are all in one of its halves
        run: |
          list() { go test -tags integration -list "$1" ./packs/web/core | grep -cE '^(Test|Example|Fuzz)'; }
          all=$(list '.*') a=$(list '^Test[A-G]') b=$(list '^Test[H-Z]')
          [ "$all" -eq $((a + b)) ] || { echo "::error::$((all - a - b)) of web-core's tests are in neither half: name each Test and a capital letter"; exit 1; }
      - if: matrix.part == 'core-a-g'
        run: xvfb-run -a scripts/gotest.sh -race -tags integration -timeout 10m -run '^Test[A-G]' ./packs/web/core
      - if: matrix.part == 'core-h-z'
        run: xvfb-run -a scripts/gotest.sh -race -tags integration -timeout 10m -run '^Test[H-Z]' ./packs/web/core
      # A sound server, of a sink that plays to nothing, for the microphone's tests: with none,
      # Firefox's Web Audio never runs (its AudioContext stays suspended).
      - if: matrix.part == 'packs'
        name: a sound server
        run: |
          sudo apt-get install -y -qq pulseaudio > /dev/null
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=axx > /dev/null
      - if: matrix.part == 'packs'
        run: |
          mapfile -t packs < <(go list ./packs/web/... | grep -v -e /packs/web/lighthouse -e '/packs/web/core$')
          xvfb-run -a scripts/gotest.sh -race -tags integration -timeout 10m "${packs[@]}" ./packs/models/web/...
      - if: matrix.part == 'lighthouse'
        run: xvfb-run -a scripts/gotest.sh -race -tags integration -timeout 10m ./packs/web/lighthouse/...
      - if: ${{ !cancelled() && matrix.part == 'packs' }}
        uses: ./.github/actions/web-tools
        with:
          mode: save

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    # The mobile packs' tests, on an Android emulator that axx starts (KVM). The iOS pack's
    # skip here: they run in the ios job.
    name: mobile (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The Android pack's integration tests run one after another, each on an emulator, and the
        # models-android pack's on one of their own: in nine parts of some 2.5 to 3.5 minutes each
        # on these runners, after some 3 of setting up (no job runs past 10). With no tests to run,
        # one part builds them, and keeps the couriers' app and the emulator's device for the rest.
        part: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '["emulator-1", "emulator-2", "emulator-3", "emulator-4", "emulator-5", "emulator-6", "models-1", "models-2", "models-3"]' || '["emulator-1"]') }}
    env:
      PART: ${{ matrix.part }}
    steps:
      - name: KVM, for the emulator, and where its devices are
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # avdmanager would go by the runner's XDG_CONFIG_HOME, and the emulator not.
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The examples' model files (Git LFS).
      - uses: ./.github/actions/lfs
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      # Gradle's caches: written on main only (the action's default), read by pull requests.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # The couriers' app (the models-android pack's tests build an app of their own) and the
      # emulator's device, from their caches, or made while the rest sets up.
      - uses: ./.github/actions/courier-android
        with:
          mode: start
          app: ${{ !startsWith(matrix.part, 'models-') }}
          emulator: ${{ needs.changes.outputs.tests == 'true' }}
          save-emulator: ${{ matrix.part == 'emulator-1' }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: acceptance
      - name: the tests, built
        run: |
          case "$PART" in
            models-*) go test -race -tags integration -run '^$' ./packs/models/android/... ;;
            *) go test -race -tags integration -run '^$' ./packs/mobile/... ;;
          esac
      - uses: ./.github/actions/courier-android
        with:
          mode: finish
          app: ${{ !startsWith(matrix.part, 'models-') }}
          emulator: ${{ needs.changes.outputs.tests == 'true' }}
          save-emulator: ${{ matrix.part == 'emulator-1' }}
      - if: needs.changes.outputs.tests == 'true' && startsWith(matrix.part, 'emulator-')
        run: |
          # The parts, by their tests' times here (gotestsum's slowest): the sixth runs the rest.
          one='TestACourierReadsATornLabelOnAnEmulator'
          two='TestCouriersOnAnEmulator|TestACourierScansALabelOnAnEmulator'
          three='TestACourierAttachesADocumentOnAnEmulator|TestACourierSharesTheVanOnAnEmulator'
          four='TestACourierWalksUpToAParcelAndMeasuresItOnAnEmulator|TestACourierPhotographsAParcelAtTheDoorOnAnEmulator'
          five='TestACourierMeasuresAParcelOnAnEmulator|TestRecordingsOnAnEmulator'
          case "$PART" in
            emulator-1) select=(-run "^($one)\$") ;;
            emulator-2) select=(-run "^($two)\$") ;;
            emulator-3) select=(-run "^($three)\$") ;;
            emulator-4) select=(-run "^($four)\$") ;;
            emulator-5) select=(-run "^($five)\$") ;;
            *) select=(-skip "^($one|$two|$three|$four|$five)\$") ;;
          esac
          GOTEST_SLOWEST=1s scripts/gotest.sh -race -tags integration -timeout 10m "${select[@]}" ./packs/mobile/...
      # The models-android pack's tests, in three parts, on an emulator of the device's snapshot.
      - if: needs.changes.outputs.tests == 'true' && startsWith(matrix.part, 'models-')
        name: platform model adapters in a debuggable emulator app
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd parcels-pixel -read-only -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -port 5580 > "$RUNNER_TEMP/models-emulator.log" 2>&1 &
          model_emulator_pid=$!
          trap '"$ANDROID_HOME/platform-tools/adb" -s emulator-5580 emu kill || true; wait "$model_emulator_pid" || true' EXIT
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5580 wait-for-device
          for _ in $(seq 180); do
            [ "$("$ANDROID_HOME/platform-tools/adb" -s emulator-5580 shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break
            sleep 1
          done
          [ "$("$ANDROID_HOME/platform-tools/adb" -s emulator-5580 shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { cat "$RUNNER_TEMP/models-emulator.log"; exit 1; }
          case "$PART" in
            models-1) select=(-run '^TestAndroidSpeechTellsOneSpeakersPhrasesApart$') ;;
            models-2) select=(-run '^TestAndroidAppLaunchHook$') ;;
            *) select=(-skip '^(TestAndroidSpeechTellsOneSpeakersPhrasesApart|TestAndroidAppLaunchHook)$') ;;
          esac
          AXX_MODELS_ANDROID_SERIAL=emulator-5580 GOTEST_SLOWEST=1s scripts/gotest.sh -race -tags integration -timeout 10m "${select[@]}" ./packs/models/android/...

  android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && needs.changes.outputs.tests == 'true'
    # The parcels example's Android scenarios, on an emulator axx starts (KVM), against the
    # whole example, which axx starts too. A runner runs a feature, or a shard of it (axx run
    # --shard), on one emulator, a scenario at a time: some 3 to 4 minutes' worth on a fast
    # runner (a minute of it starting the example; a documents scenario takes nearly 2), after
    # some 3 of setting up, so that a slow one (the same scenarios took up to 1.5 times as long)
    # takes no job past 10.
    name: android (${{ matrix.feature }} ${{ matrix.part }}/${{ matrix.of }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {feature: courier-app, part: 1, of: 5}
          - {feature: courier-app, part: 2, of: 5}
          - {feature: courier-app, part: 3, of: 5}
          - {feature: courier-app, part: 4, of: 5}
          - {feature: courier-app, part: 5, of: 5}
          - {feature: courier-app-camera, part: 1, of: 2}
          - {feature: courier-app-camera, part: 2, of: 2}
          - {feature: courier-app-documents, part: 1, of: 6}
          - {feature: courier-app-documents, part: 2, of: 6}
          - {feature: courier-app-documents, part: 3, of: 6}
          - {feature: courier-app-documents, part: 4, of: 6}
          - {feature: courier-app-documents, part: 5, of: 6}
          - {feature: courier-app-documents, part: 6, of: 6}
          - {feature: courier-app-measure, part: 1, of: 2}
          - {feature: courier-app-measure, part: 2, of: 2}
          - {feature: courier-app-notifications, part: 1, of: 3}
          - {feature: courier-app-notifications, part: 2, of: 3}
          - {feature: courier-app-notifications, part: 3, of: 3}
    steps:
      # The example's images need more disk than a runner of 14 GB free had: on one with less
      # than 40 GB free, remove toolchains the job never uses (not the Android SDK), in the
      # background while the job sets up. GitHub's runners have 80 GB free now.
      - name: free disk space (in the background)
        run: |
          (if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          fi; touch "$RUNNER_TEMP/disk-freed") > /dev/null 2>&1 &
      - name: KVM, for the emulator, and where its devices are
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # avdmanager would go by the runner's XDG_CONFIG_HOME, and the emulator not.
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The examples' model files (Git LFS).
      - uses: ./.github/actions/lfs
      # Docker Hub's images through Google's mirror: Docker Hub refuses the runners at times.
      - uses: ./.github/actions/docker-hub-mirror
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      # Gradle's caches: written on main only (the action's default), read by pull requests.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # The couriers' app and the emulator's device, from their caches, or made while the rest
      # sets up.
      - uses: ./.github/actions/courier-android
        with:
          mode: start
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: acceptance
      - name: wait for the disk space
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/disk-freed" ] && break; sleep 2; done
          [ -f "$RUNNER_TEMP/disk-freed" ] || { echo "::error::the disk space was not freed within 10 minutes"; exit 1; }
          df -h /
      # What the example pulls (2 GB), and axx, while the example's own images are made.
      - name: the example's images and axx (in the background)
        run: |
          (status=0; docker compose -f examples/parcels/infra/compose.yaml pull --ignore-buildable --quiet > "$RUNNER_TEMP/pull.log" 2>&1 || status=$?; echo "$status" > "$RUNNER_TEMP/pull.done") &
          (status=0; go build -o "$RUNNER_TEMP/bin/axx" ./internal/tools/axxall > "$RUNNER_TEMP/axx.log" 2>&1 || status=$?; echo "$status" > "$RUNNER_TEMP/axx.done") &
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The images the example's compose file builds: in seconds, not minutes.
      - uses: ./.github/actions/parcels-images
      - name: wait for axx, with every pack
        run: |
          for _ in $(seq 450); do [ -f "$RUNNER_TEMP/axx.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/axx.log"
          [ "$(cat "$RUNNER_TEMP/axx.done" 2> /dev/null)" = 0 ] || { echo "::error::axx was not built"; exit 1; }
      - name: the fixtures, as a fresh clone has them
        working-directory: examples/parcels/acceptance
        run: |
          axx fixtures check
          axx fixtures generate
      - uses: ./.github/actions/courier-android
        with:
          mode: finish
      - name: wait for the example's images
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/pull.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/pull.log"
          # A pull that failed is done again as the example starts.
          [ "$(cat "$RUNNER_TEMP/pull.done" 2> /dev/null)" = 0 ] || echo "::warning::the example's images were not all pulled"
      - if: matrix.feature == 'courier-app' && matrix.part == 1
        name: every Android feature runs on one of the runners
        working-directory: examples/parcels/acceptance
        run: |
          android=$(grep -rl --include='*.feature' '@android' features | sort | tr '\n' ' ')
          [ "$android" = "features/courier-app-camera/courier-app-camera-android.feature features/courier-app-documents/courier-app-documents-android.feature features/courier-app-measure/courier-app-measure-android.feature features/courier-app-notifications/courier-app-notifications-android.feature features/courier-app/courier-app-android.feature " ] || { echo "::error::the android job runs courier-app, courier-app-camera, courier-app-documents, courier-app-measure and courier-app-notifications, and the Android features are: $android"; exit 1; }
      # How busy the runner and the emulator are while the scenarios run.
      - uses: ./.github/actions/android-load
      - working-directory: examples/parcels/acceptance
        env:
          FEATURE: ${{ matrix.feature }}
          SHARD: ${{ matrix.part }}/${{ matrix.of }}
        run: |
          axx run --tags @android --shard "$SHARD" --format progress --format junit:build/axx/junit.xml --format html:build/axx/report.html \
            --set packs.mobile-core.traces=failed --set packs.mobile-core.videos=failed "features/$FEATURE/$FEATURE-android.feature"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-${{ matrix.feature }}-${{ matrix.part }}
          # The report, and the traces, videos, screenshots and the emulators' logs a failure
          # leaves.
          path: |
            examples/parcels/acceptance/build/axx/
            examples/parcels/acceptance/.axx/mobile/
            examples/parcels/acceptance/.axx/logs/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: ./.github/actions/android-load
        with:
          mode: report

  mac-tests:
    needs: changes
    if: (needs.changes.outputs.mobile == 'true' || needs.changes.outputs.models == 'true') && needs.changes.outputs.tests == 'true'
    # The tests the Mac jobs run (ios, coreml), built for macOS here, as axx builds for it (no
    # cgo), with a build cache of its own, for the Mac jobs to download (.github/actions/mac-tests):
    # each took 85 to 100 seconds of its ten minutes restoring Go's module cache and building them,
    # with no build cache, on a runner of three cores.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: mac-tests
      # Each test binary in its package's folder, where scripts/gotest.sh runs it, and test2json
      # for macOS, which Go builds when it is asked for (go tool test2json).
      - name: the tests, built for macOS
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          built=(bin/test2json)
          go build -o bin/test2json cmd/test2json
          for pkg in packs/mobile/ios packs/models/ios packs/models/macos packs/models/core/format/coreml packs/models/core/format/foundationmodels; do
            go test -c -tags integration -o "$pkg/$(basename "$pkg").test" "./$pkg"
            built+=("$pkg/$(basename "$pkg").test")
          done
          tar -cf "$RUNNER_TEMP/mac-tests.tar" "${built[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac-tests
          path: ${{ runner.temp }}/mac-tests.tar
          retention-days: 1
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: mac-tests
          mode: save
          modules: "false"

  ios:
    needs: [changes, mac-tests]
    if: needs.changes.outputs.mobile == 'true' && needs.changes.outputs.tests == 'true'
    # The iOS pack, on simulators axx makes, with the parcels example's couriers' iOS app. The
    # example's iOS scenarios need the whole example, and macOS runners have no Docker: they
    # run on developers' Macs.
    # The tests run on nine runners, a simulator each, some 2 to 4 minutes' worth on each after
    # some 4.5 of setting up (the simulator's first boot takes 2 to 3; a part's first test takes a
    # minute longer, as the simulator's first app does), so that no job runs past 10:
    # TestCouriersOnASimulator, two scenarios long, and TestRecordingsOnASimulator on one; the
    # camera's on four; the notifications' and the reminder's on one each; sharing the van on
    # one; the others on the ninth.
    name: ios (${{ matrix.tests }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - tests: couriers
            select: -test.run=^(TestCouriersOnASimulator|TestRecordingsOnASimulator)$
          - tests: camera-1
            select: -test.run=^(TestThePhoneMovesThroughTheScene|TestTheCameraSeesASceneAnImageOrAVideo)$
          - tests: camera-2
            select: -test.run=^TestACourierMeasuresAParcelOnASimulator$
          - tests: camera-3
            select: -test.run=^(TestACourierWalksUpToAParcelAndMeasuresItOnASimulator|TestACourierPhotographsAParcelAtTheDoorOnASimulator)$
          - tests: camera-4
            select: -test.run=^(TestACourierReadsATornLabelOnASimulator|TestACourierScansALabelOnASimulator)$
          - tests: notifications
            select: -test.run=^TestACourierFollowsNotificationsOnASimulator$
          - tests: reminder
            select: -test.run=^TestACourierIsRemindedOfTheRoundOnASimulator$
          - tests: shares
            select: -test.run=^TestACourierSharesTheVanOnASimulator$
          - tests: others
            select: -test.skip=^(TestCouriersOnASimulator|TestRecordingsOnASimulator|TestThePhoneMovesThroughTheScene|TestACourierReadsATornLabelOnASimulator|TestACourierScansALabelOnASimulator|TestTheCameraSeesASceneAnImageOrAVideo|TestACourierMeasuresAParcelOnASimulator|TestACourierWalksUpToAParcelAndMeasuresItOnASimulator|TestACourierPhotographsAParcelAtTheDoorOnASimulator|TestACourierFollowsNotificationsOnASimulator|TestACourierIsRemindedOfTheRoundOnASimulator|TestACourierSharesTheVanOnASimulator)$
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The examples' model files (Git LFS).
      - uses: ./.github/actions/lfs
      - uses: ./.github/actions/simulator-mac
      # gotestsum, which runs the tests that the mac-tests job built.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/mac-tests
      # The couriers' app: from its cache, or built.
      - uses: ./.github/actions/courier-ios
      - uses: ./.github/actions/simulator-builds
        with:
          part: ios-${{ matrix.tests }}
      # The simulator the tests keep (scripts/ios-simulator.sh), made and booted once everything
      # else is ready: its first boot takes a minute or more on these runners, and slowed whatever
      # ran beside it far more than it saved. Restoring the caches took fifty times as long (218 s
      # for the tools' 103 MB, against 4 s in the test job, on the same image), building the app
      # three to six times (101 s and 200 s, against 31), and building the tests six (151 s and
      # 174 s, against 23).
      - name: the tests' simulator
        run: scripts/ios-simulator.sh
      # The tests share that simulator, kept booted from one to the next, as a run's worker has
      # one. Each prints the packs' log (how long the simulator took to get ready, each part, and
      # each step), and a failed one the end of its logs and the screen it read. Without the race
      # detector: on three cores it doubled the tests' time (783 s against 405 s, measured on a VM
      # of this runner's size), and the Android jobs run the shared mobile code with it.
      - env:
          SELECT: ${{ matrix.select }}
        run: GOTEST_FORMAT=standard-verbose GOTEST_SLOWEST=1s scripts/gotest.sh packs/mobile/ios/ios.test -test.timeout=10m "$SELECT"
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/simulator-builds
        with:
          part: ios-${{ matrix.tests }}
          mode: save
      - if: always()
        uses: ./.github/actions/simulator-mac
        with:
          mode: report

  coreml:
    needs: [changes, mac-tests]
    if: needs.changes.outputs.models == 'true' && needs.changes.outputs.tests == 'true'
    # The models-core pack's Core ML stubs, compiled by Core ML's compiler and run in Core ML, which
    # runs on Macs only (its other formats' runtimes, ONNX Runtime and LiteRT, run in the
    # integration job); and its Foundation Models stubs, built with Xcode 27's Swift and given to
    # Foundation Models' sessions, which take a model of an app's from macOS 27: the xcode-27
    # image's. In four parts, none of which runs past 10 minutes: the Mac's, and the simulator's
    # in three, by their tests' times on this runner (the courier's; Foundation Models' sessions,
    # the platform calls and audio capture, 74 s; speech, 137 s, and the rest).
    name: coreml (${{ matrix.part }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [mac, simulator-1, simulator-2, simulator-3]
    env:
      PART: ${{ matrix.part }}
      SIMULATOR_1: ^TestCourierUsesPlatformFixtureWithoutDebugProvider$
      SIMULATOR_2: ^(TestFoundationModelsOrdinarySessions|TestSimulatorPlatformCalls|TestSimulatorCaptureHearsTheRecording)$
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The examples' model files (Git LFS).
      - uses: ./.github/actions/lfs
      - if: matrix.part != 'mac'
        uses: ./.github/actions/simulator-mac
      # gotestsum, which runs the tests that the mac-tests job built.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:gotestyourself/gotestsum"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/mac-tests
      - if: matrix.part == 'mac'
        run: scripts/gotest.sh packs/models/core/format/coreml/coreml.test -test.timeout=10m -test.run=TestCoreML
      - if: matrix.part == 'mac'
        run: scripts/gotest.sh packs/models/core/format/foundationmodels/foundationmodels.test -test.timeout=10m -test.run=TestFoundationModels
      # The courier's ordinary Foundation Models calls: its app, from its cache, or built.
      - if: matrix.part == 'simulator-1'
        uses: ./.github/actions/courier-ios
      - if: matrix.part != 'mac'
        uses: ./.github/actions/simulator-builds
        with:
          part: coreml-${{ matrix.part }}
      # The simulator as the ios job makes it (the newest iOS, 27's on this image), its first
      # boot's work no test needs off: a bare one, on this runner, did not yet serve apps' requests
      # for notifications after minutes (the courier's sign-in asks for them). Made once the rest
      # is ready, as the ios job's is: its first boot slows whatever runs beside it (started with
      # the job, it made installing the tools take 320 seconds, not 13, and restoring Go's cache
      # 235, not 39).
      - if: matrix.part != 'mac'
        name: the tests' simulator
        run: |
          made=$(scripts/ios-simulator.sh)
          echo "$made"
          echo "AXX_IOS_MODELS_SIMULATOR=$(sed -n 's/.*(\([0-9A-F-]\{36\}\)) booted in .*/\1/p' <<< "$made")" >> "$GITHUB_ENV"
      - if: matrix.part != 'mac'
        name: platform model adapters in the simulator
        run: |
          case "$PART" in
            simulator-1) select=(-test.run "$SIMULATOR_1") ;;
            simulator-2) select=(-test.run "$SIMULATOR_2") ;;
            *) select=(-test.skip "$SIMULATOR_1|$SIMULATOR_2") ;;
          esac
          GOTEST_FORMAT=standard-verbose GOTEST_SLOWEST=1s scripts/gotest.sh packs/models/ios/ios.test -test.timeout=10m "${select[@]}"
      # The same adapters in Mac programs, as macOS loads them into a Mac app's test build; Foundation
      # Models' on this image's macOS 27.
      - if: matrix.part == 'mac'
        name: platform model adapters on the Mac
        run: scripts/gotest.sh packs/models/macos/macos.test -test.timeout=10m
      - if: ${{ !cancelled() && matrix.part != 'mac' }}
        uses: ./.github/actions/simulator-builds
        with:
          part: coreml-${{ matrix.part }}
          mode: save
      - if: ${{ always() && matrix.part != 'mac' }}
        uses: ./.github/actions/simulator-mac
        with:
          mode: report

  windows-models:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.tests == 'true'
    # The models-windows pack's adapters on Windows, given to probe programs as desktop-windows
    # starts an app: SAPI's voice, its engine built with the .NET SDK, and the Windows AI APIs'
    # library, built with Visual Studio's C++ tools and C++/WinRT. The runner is an administrator
    # (SAPI lists the voices of HKEY_LOCAL_MACHINE), and Developer Mode registers the AI probe's
    # package of no signature: the Windows AI APIs answer an app with package identity, whose user
    # lets apps use them.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: stop Windows Defender's real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Developer Mode
        shell: pwsh
        run: |
          $k = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $k)) { New-Item $k -Force | Out-Null }
          New-ItemProperty -Path $k -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
      # Settings > Privacy & security > Text and image generation, on for the device and the
      # runner's user, as on a PC whose user lets apps use the Windows AI APIs (systemAIModels):
      # this image has it off, and Windows refuses every app the APIs.
      - name: apps may use the Windows AI APIs
        shell: pwsh
        run: |
          foreach ($root in 'HKLM:', 'HKCU:') {
            $k = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\systemAIModels"
            if (-not (Test-Path $k)) { New-Item $k -Force | Out-Null }
            Set-ItemProperty -Path $k -Name Value -Value Allow
          }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: windows-models
      - run: go test -tags integration -timeout 10m ./packs/models/windows/...

  webllm:
    needs: changes
    if: needs.changes.outputs.models == 'true' && needs.changes.outputs.tests == 'true'
    # The models-core pack's MLC stubs in WebLLM, on a Mac's GPU (Metal, through Chromium's
    # WebGPU): a stub is of its real model's size (GBs), and a runner takes an eighth of them by
    # their times, some 6 minutes' worth (no test step runs past 10); -v logs each model's time.
    name: webllm (${{ matrix.shard }}/8)
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
      - run: go test -tags integration -timeout 10m -v -run TestWebLLM ./packs/models/core/format/mlc/
        env:
          AXX_WEBLLM_SHARD: ${{ matrix.shard }}/8

  desktop-image:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # The image the depot desk's Linux builds run in (examples/parcels/depot-desk/linux), built
    # once for each version of its Dockerfile and kept in the registry: every run, and every
    # developer, uses the same libraries, which draw the same pixels as the screenshots kept.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Docker Hub's images through Google's mirror: Docker Hub refuses the runners at times.
      - uses: ./.github/actions/docker-hub-mirror
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          tag=$(cat examples/parcels/depot-desk/linux/Dockerfile examples/parcels/depot-desk/linux/run.sh | sha256sum | cut -c1-16)
          echo "image=ghcr.io/$OWNER/axx-depot-desk:$tag" >> "$GITHUB_OUTPUT"
      - name: the image, unless the registry has it
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is in the registry"
          else
            docker build -t "$IMAGE" examples/parcels/depot-desk/linux
            docker push "$IMAGE"
          fi

  desktop:
    needs: [changes, desktop-image]
    if: needs.changes.outputs.desktop == 'true'
    # The depot desk's feature (examples/parcels/depot-desk) with axx, against each Linux build of
    # the desk, on X11 and, in a GNOME session of its own, on Wayland: the baseline that keeps every
    # toolkit working. It runs in the desk's image, which draws what the screenshots kept show. The
    # macOS and Windows builds run on developers' machines. A failure leaves its report, the
    # traces and the screenshots the run took.
    name: desktop (${{ matrix.build }}, ${{ matrix.display }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # On main, only the entry that keeps the build cache.
        build: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '["gtk3", "gtk4", "qt6", "qt5", "swing", "electron", "tauri", "flutter"]' || '["gtk3"]') }}
        display: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '["x11", "wayland"]' || '["x11"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The examples' model files (Git LFS): the GTK builds' model stubs.
      - uses: ./.github/actions/lfs
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: desktop
      - name: axx, with every pack
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/axx" ./internal/tools/axxall
      - if: needs.changes.outputs.tests == 'true'
        name: the depot desk's feature, in its image
        env:
          IMAGE: ${{ needs.desktop-image.outputs.image }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ matrix.build }}
          DISPLAY_SERVER: ${{ matrix.display }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          mkdir -p "$RUNNER_TEMP/out"
          # GNOME Shell takes /run/systemd/seats for logind's, which a container has not.
          docker run --rm --shm-size=1g --tmpfs /run/systemd \
            -v "$PWD/examples/parcels/depot-desk:/src:ro" -v "$RUNNER_TEMP/axx:/usr/local/bin/axx:ro" -v "$RUNNER_TEMP/out:/out" \
            "$IMAGE" depot-desk "$BUILD" "$DISPLAY_SERVER" --format progress --format junit:/out/junit.xml \
            --format html:/out/report.html --set packs.desktop-core.traces=failed
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.build }}-${{ matrix.display }}
          # Not the apps' homes in .axx: the container wrote them, some unreadable here.
          path: |
            ${{ runner.temp }}/out/*.xml
            ${{ runner.temp }}/out/*.html
            ${{ runner.temp }}/out/screenshots/
            ${{ runner.temp }}/out/.axx/desktop/traces/
            ${{ runner.temp }}/out/.axx/desktop/videos/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() && matrix.build == 'gtk3' && matrix.display == 'x11' }}
        uses: ./.github/actions/go-cache
        with:
          build: desktop
          mode: save

  cross-build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # CGO_ENABLED=0 must keep working for every release target. Built with -trimpath like
    # GoReleaser, so release-check and the release dry run reuse this job's build cache.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/axx
          done
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: cross
          mode: save
          modules: "false"

  example-app:
    needs: changes
    if: needs.changes.outputs.examples == 'true' && needs.changes.outputs.tests == 'true'
    # The services the examples test are Go modules of their own.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [parcels, parcel-claims, carrier-billing, customs-clearance]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go golangci-lint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: go mod tidy -diff
      - run: go test ./...
      - run: golangci-lint run

  example-app-python:
    needs: changes
    if: needs.changes.outputs.examples == 'true' && needs.changes.outputs.tests == 'true'
    # The parcel-support example's service is a Python project of its own (uv's).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/parcel-support/app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "uv"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen pytest

  acceptance:
    needs: changes
    if: needs.changes.outputs.acceptance == 'true'
    # Each example's acceptance suite, the way its README runs it: axx starts the service and
    # its infrastructure with Docker Compose, runs the features and removes everything. axx is
    # built with every pack, so it prepares none. parcel-support's features and its other
    # engines' runs (some 5 minutes each) are two jobs.
    name: acceptance (${{ matrix.example }}${{ matrix.engines && ', its engines' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # On main, only parcels, whose job keeps the caches.
        include: ${{ fromJSON(needs.changes.outputs.tests == 'true' && '[{"example":"parcels"}, {"example":"parcel-claims"}, {"example":"carrier-billing"}, {"example":"customs-clearance"}, {"example":"parcel-support"}, {"example":"parcel-support", "engines":true}]' || '[{"example":"parcels"}]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The examples' model files (Git LFS).
      - uses: ./.github/actions/lfs
      # Docker Hub's images through Google's mirror: Docker Hub refuses the runners at times.
      - uses: ./.github/actions/docker-hub-mirror
      # What the parcels example pulls (2 GB), while the job sets up.
      - if: matrix.example == 'parcels' && needs.changes.outputs.tests == 'true'
        name: the example's images (in the background)
        run: (status=0; docker compose -f examples/parcels/infra/compose.yaml pull --ignore-buildable --quiet > "$RUNNER_TEMP/pull.log" 2>&1 || status=$?; echo "$status" > "$RUNNER_TEMP/pull.done") &
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: acceptance
      - name: axx, with every pack
        run: |
          go build -o "$RUNNER_TEMP/bin/axx" ./internal/tools/axxall
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The parcels shop portal's features run in browsers.
      - if: matrix.example == 'parcels' && needs.changes.outputs.tests == 'true'
        uses: ./.github/actions/web-tools
      # The image parcel-support's compose file builds: in a minute, not five.
      - if: matrix.example == 'parcel-support' && needs.changes.outputs.tests == 'true'
        uses: ./.github/actions/support-image
      # The images parcels' compose file builds: in seconds, not minutes.
      - if: matrix.example == 'parcels'
        uses: ./.github/actions/parcels-images
      - if: needs.changes.outputs.tests == 'true'
        name: the fixtures, as a fresh clone has them
        working-directory: examples/${{ matrix.example }}/acceptance
        run: |
          axx fixtures check
          axx fixtures generate
      - if: matrix.example == 'parcels' && needs.changes.outputs.tests == 'true'
        name: wait for the example's images
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/pull.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/pull.log"
          # A pull that failed is done again as the example starts.
          [ "$(cat "$RUNNER_TEMP/pull.done" 2> /dev/null)" = 0 ] || echo "::warning::the example's images were not all pulled"
      - if: needs.changes.outputs.tests == 'true' && !matrix.engines
        working-directory: examples/${{ matrix.example }}/acceptance
        # The Android scenarios run in the android job, on an emulator; the iOS ones on Macs, as
        # do those whose pages run a model on the GPU (@gpu): a runner has none.
        run: axx run --tags "not @mobile and not @gpu" --format progress --format junit:build/axx/junit.xml --format html:build/axx/report.html
      # The parcel-support service's transcriber and photo check on their other engines, each
      # with a stub of its engine's format (the example's profiles).
      - if: matrix.engines && needs.changes.outputs.tests == 'true'
        working-directory: examples/parcel-support/acceptance
        run: |
          for engine in openai-whisper transformers parakeet.cpp llama.cpp onnxruntime-genai ncnn mnn executorch keras; do
            axx run --profile "$engine" --format progress
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-${{ matrix.example }}${{ matrix.engines && '-engines' || '' }}
          # The report, and the screenshots, traces and logs a failure leaves.
          path: |
            examples/${{ matrix.example }}/acceptance/build/axx/
            examples/${{ matrix.example }}/acceptance/.axx/web/
            examples/${{ matrix.example }}/acceptance/.axx/logs/
          if-no-files-found: ignore
          retention-days: 7
      # How long the example took to build, pull and start, from its log.
      - if: ${{ !cancelled() && matrix.example == 'parcels' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apps-log-parcels
          path: examples/parcels/acceptance/.axx/logs/services.log
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() && matrix.example == 'parcels' }}
        uses: ./.github/actions/go-cache
        with:
          build: acceptance
          mode: save
          modules: "false"

  release-check:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go goreleaser"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: goreleaser check
      - run: GORELEASER_CURRENT_TAG=$(scripts/cli-tag.sh) goreleaser build --snapshot --clean --single-target

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:rhysd/actionlint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: mise exec aqua:rhysd/actionlint -- actionlint
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # Security audit of every workflow (template injection, permissions, pinning...).
      - run: uvx zizmor --offline --min-severity medium --format github .github/workflows

  # A push to main keeps a build cache of its own for each job and OS (go-cache), and GitHub keeps
  # 10 GB of a repository's caches, dropping the least used over that: the browsers' among them,
  # which every web job then downloads again. Main keeps only the newest of each: Go's build
  # caches by job and OS, its module caches and the browsers by OS. (Docker's layers, Gradle's and
  # mise's caches look after their own.)
  caches:
    if: always() && github.event_name == 'push'
    needs: [hygiene, lint, test, integration, web, mobile, desktop, cross-build, mac-tests, acceptance]
    runs-on: ubuntu-24.04
    permissions:
      actions: write # to delete caches
    steps:
      - name: the older caches of each, deleted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list -R "$REPO" --ref refs/heads/main --limit 1000 --json id,key,createdAt --jq '
            map(select(.key | test("^(go-build|go-mod|web-tools|lfs)-")) | .family = (.key | sub("(-[0-9a-f]{8,})+$"; "")))
            | group_by(.family) | map(sort_by(.createdAt) | reverse | .[1:][]) | .[] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "deleting $key"
              gh cache delete -R "$REPO" "$id"
            done

  # Single required status check; keeps branch protection simple as jobs are added. A job a
  # pull request does not need is skipped, which passes.
  ci-ok:
    if: always()
    needs: [changes, hygiene, lint, workflows, test, integration, web, mobile, android, mac-tests, ios, coreml, windows-models, webllm, desktop-image, desktop, cross-build, example-app, example-app-python, acceptance, release-check]
    runs-on: ubuntu-24.04
    steps:
      - name: all jobs passed
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
