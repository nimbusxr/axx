name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a pull request needs, from the files it changes (scripts/ci-changes.sh). Pushes
  # to main and the merge queue run every job, and so does a change to CI itself.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.changes.outputs.go }}
      integration: ${{ steps.changes.outputs.integration }}
      web: ${{ steps.changes.outputs.web }}
      mobile: ${{ steps.changes.outputs.mobile }}
      examples: ${{ steps.changes.outputs.examples }}
      acceptance: ${{ steps.changes.outputs.acceptance }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      # A pull request is checked out as its merge into the base branch, the merge's first
      # parent: the two differ by what the pull request changes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$files" | scripts/ci-changes.sh
          else
            scripts/ci-changes.sh --all
          fi | tee -a "$GITHUB_OUTPUT"

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:gitleaks/gitleaks"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: scripts/hygiene.sh
      - name: gitleaks (history)
        run: gitleaks git --no-banner --redact .

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go golangci-lint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: lint
          extra-paths: ~/.cache/golangci-lint
      - run: go mod tidy -diff
      - name: generated files are up to date
        run: |
          go generate ./...
          # untracked files count too (a newly generated page must be committed)
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: golangci-lint run
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # This job keeps Linux's module cache (see .github/actions/go-cache).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: lint
          mode: save
          extra-paths: ~/.cache/golangci-lint

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows scans every file the checkout, the cache restore and the build write, which
      # makes them slow: its real-time scanning is off on this runner, which lasts one job.
      - if: runner.os == 'Windows'
        name: stop Windows Defender's real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      # And its D: drive, where the runner's temporary folder is, writes Go's many small cache
      # files much faster than C:, where Go keeps them.
      - if: runner.os == 'Windows'
        name: "Go's caches on the D: drive"
        shell: pwsh
        run: |
          "GOCACHE=$env:RUNNER_TEMP\go-build" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP\go-mod" >> $env:GITHUB_ENV
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - run: go test -race ./...
      # On macOS and Windows this job keeps the module cache too (lint does on Linux).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: test
          mode: save
          modules: ${{ runner.os != 'Linux' }}

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    # Packs against real services (PostgreSQL, MongoDB, Kafka, WireMock, the cloud emulators)
    # via testcontainers. It reads the test job's cache.
    runs-on: ubuntu-24.04
    steps:
      # The services' images and the race-detector builds need more disk than a runner has
      # free: remove toolchains the job never uses, in the background while the job sets up.
      - name: free disk space (in the background)
        run: (sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift; touch "$RUNNER_TEMP/disk-freed") > /dev/null 2>&1 &
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - name: wait for the disk space
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/disk-freed" ] && break; sleep 2; done
          [ -f "$RUNNER_TEMP/disk-freed" ] || { echo "::error::the disk space was not freed within 10 minutes"; exit 1; }
          df -h /
      # The web and mobile packs have jobs of their own (web, mobile).
      - run: |
          mapfile -t packs < <(go list ./packs/... | grep -v -e /packs/web -e /packs/mobile)
          go test -race -tags integration -timeout 20m "${packs[@]}" ./internal/engine/... ./internal/packbuild/...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # The web pack in Chromium, Firefox and WebKit, which it downloads on first use; the watching
    # test opens browser windows, on a virtual screen.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - uses: ./.github/actions/web-tools
      - run: |
          mapfile -t packs < <(go list ./packs/web/... | grep -v /packs/web/lighthouse)
          xvfb-run -a go test -race -tags integration -timeout 20m "${packs[@]}"
      # The Lighthouse audits run on their own: a score measures the machine's load too, and
      # the other packages' browsers would take its CPU.
      - if: ${{ !cancelled() }}
        run: xvfb-run -a go test -race -tags integration -timeout 20m ./packs/web/lighthouse/...
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/web-tools
        with:
          mode: save

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    # The mobile packs' tests, on an Android emulator that axx starts (KVM). The iOS pack's
    # skip here: they run in the ios job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: KVM, for the emulator, and where its devices are
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # avdmanager would go by the runner's XDG_CONFIG_HOME, and the emulator not.
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      # The emulator's device and its boot snapshot, while the rest sets up.
      - name: the emulator's device (in the background)
        working-directory: examples/parcels/courier/android
        run: (./create-emulator.sh > "$RUNNER_TEMP/device.log" 2>&1; echo $? > "$RUNNER_TEMP/device.done") &
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: acceptance
      # Gradle's caches: written on main only (the action's default), read by pull requests.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: the couriers' app
        working-directory: examples/parcels/courier/android
        run: ./gradlew --no-daemon --console=plain assembleDebug
      - name: the tests, built
        run: go test -race -tags integration -run '^$' ./packs/mobile/...
      - name: wait for the emulator's device
        run: |
          for _ in $(seq 450); do [ -f "$RUNNER_TEMP/device.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/device.log"
          [ "$(cat "$RUNNER_TEMP/device.done" 2> /dev/null)" = 0 ] || { echo "::error::the emulator's device was not made"; exit 1; }
      - run: go test -race -tags integration -timeout 20m ./packs/mobile/...

  android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    # The parcels example's Android scenarios, on an emulator axx starts (KVM), against the
    # whole example, which axx starts too.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The example's images need more disk than a runner has free: remove toolchains the job
      # never uses (not the Android SDK), in the background while the job sets up.
      - name: free disk space (in the background)
        run: (sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift; touch "$RUNNER_TEMP/disk-freed") > /dev/null 2>&1 &
      - name: KVM, for the emulator, and where its devices are
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # avdmanager would go by the runner's XDG_CONFIG_HOME, and the emulator not.
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      # The emulator's device and its boot snapshot, while the rest sets up.
      - name: the emulator's device (in the background)
        working-directory: examples/parcels/courier/android
        run: (./create-emulator.sh > "$RUNNER_TEMP/device.log" 2>&1; echo $? > "$RUNNER_TEMP/device.done") &
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: acceptance
      # Gradle's caches: written on main only (the action's default), read by pull requests.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: the couriers' app
        working-directory: examples/parcels/courier/android
        run: ./gradlew --no-daemon --console=plain assembleDebug
      - name: wait for the disk space
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/disk-freed" ] && break; sleep 2; done
          [ -f "$RUNNER_TEMP/disk-freed" ] || { echo "::error::the disk space was not freed within 10 minutes"; exit 1; }
          df -h /
      # What the example pulls (2 GB), while the job goes on.
      - name: the example's images (in the background)
        run: (docker compose -f examples/parcels/infra/compose.yaml pull --ignore-buildable --quiet > "$RUNNER_TEMP/pull.log" 2>&1; echo $? > "$RUNNER_TEMP/pull.done") &
      - name: axx, with every pack
        run: |
          go build -o "$RUNNER_TEMP/bin/axx" ./internal/tools/axxall
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: the fixtures, as a fresh clone has them
        working-directory: examples/parcels/acceptance
        run: |
          axx fixtures check
          axx fixtures generate
      # The WireMock image the example's compose file builds: from cached layers, in seconds.
      - uses: ./.github/actions/wiremock-image
        with:
          example: examples/parcels
          image: parcels-wiremock:local
      - name: wait for the emulator's device
        run: |
          for _ in $(seq 450); do [ -f "$RUNNER_TEMP/device.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/device.log"
          [ "$(cat "$RUNNER_TEMP/device.done" 2> /dev/null)" = 0 ] || { echo "::error::the emulator's device was not made"; exit 1; }
      - name: wait for the example's images
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/pull.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/pull.log"
          # A pull that failed is done again as the example starts.
          [ "$(cat "$RUNNER_TEMP/pull.done" 2> /dev/null)" = 0 ] || echo "::warning::the example's images were not all pulled"
      - working-directory: examples/parcels/acceptance
        run: axx run --tags @android --format progress --format junit:build/axx/junit.xml --format html:build/axx/report.html
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android
          # The report, and the screenshots, Appium's and the emulators' logs a failure leaves.
          path: |
            examples/parcels/acceptance/build/axx/
            examples/parcels/acceptance/.axx/mobile/
            examples/parcels/acceptance/.axx/logs/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    # The iOS pack, on simulators axx makes, with the parcels example's couriers' iOS app. The
    # example's iOS scenarios need the whole example, and macOS runners have no Docker: they
    # run on developers' Macs.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - name: the couriers' app
        working-directory: examples/parcels/courier/ios
        run: xcodebuild -project Courier.xcodeproj -target Courier -configuration Debug -sdk iphonesimulator ONLY_ACTIVE_ARCH=NO SYMROOT=build
      - uses: ./.github/actions/ios-tools
      # Without ios-tools' cache, setting up the simulator the tests clone takes over ten
      # minutes on these runners. A failed test prints the end of its Appium's log and the
      # screen it read.
      - run: go test -race -tags integration -timeout 45m ./packs/mobile/ios/...
      - uses: ./.github/actions/ios-tools
        with:
          mode: save

  cross-build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # CGO_ENABLED=0 must keep working for every release target. Built with -trimpath like
    # GoReleaser, so release-check and the release dry run reuse this job's build cache.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/axx
          done
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: cross
          mode: save
          modules: "false"

  example-app:
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    # The services the examples test are Go modules of their own.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [parcels, parcel-claims, carrier-billing, customs-clearance]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go golangci-lint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: go mod tidy -diff
      - run: go test ./...
      - run: golangci-lint run

  acceptance:
    needs: changes
    if: needs.changes.outputs.acceptance == 'true'
    # Each example's acceptance suite, the way its README runs it: axx starts the service and
    # its infrastructure with Docker Compose, runs the features and removes everything. axx is
    # built with every pack, so it prepares none.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [parcels, parcel-claims, carrier-billing, customs-clearance]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # What the parcels example pulls (2 GB), while the job sets up.
      - if: matrix.example == 'parcels'
        name: the example's images (in the background)
        run: (docker compose -f examples/parcels/infra/compose.yaml pull --ignore-buildable --quiet > "$RUNNER_TEMP/pull.log" 2>&1; echo $? > "$RUNNER_TEMP/pull.done") &
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: acceptance
      - name: axx, with every pack
        run: |
          go build -o "$RUNNER_TEMP/bin/axx" ./internal/tools/axxall
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The parcels shop portal's features run in browsers.
      - if: matrix.example == 'parcels'
        uses: ./.github/actions/web-tools
      # The WireMock image parcels' compose file builds: from cached layers, in seconds.
      - if: matrix.example == 'parcels'
        uses: ./.github/actions/wiremock-image
        with:
          example: examples/parcels
          image: parcels-wiremock:local
      - name: the fixtures, as a fresh clone has them
        working-directory: examples/${{ matrix.example }}/acceptance
        run: |
          axx fixtures check
          axx fixtures generate
      - if: matrix.example == 'parcels'
        name: wait for the example's images
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/pull.done" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/pull.log"
          # A pull that failed is done again as the example starts.
          [ "$(cat "$RUNNER_TEMP/pull.done" 2> /dev/null)" = 0 ] || echo "::warning::the example's images were not all pulled"
      - working-directory: examples/${{ matrix.example }}/acceptance
        # The Android scenarios run in the android job, on an emulator; the iOS ones on Macs.
        run: axx run --tags "not @mobile" --format progress --format junit:build/axx/junit.xml --format html:build/axx/report.html
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-${{ matrix.example }}
          # The report, and the screenshots, traces and logs a failure leaves.
          path: |
            examples/${{ matrix.example }}/acceptance/build/axx/
            examples/${{ matrix.example }}/acceptance/.axx/web/
            examples/${{ matrix.example }}/acceptance/.axx/logs/
          if-no-files-found: ignore
          retention-days: 7
      # How long the example took to build, pull and start, from its log.
      - if: ${{ !cancelled() && matrix.example == 'parcels' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apps-log-parcels
          path: examples/parcels/acceptance/.axx/logs/apps.log
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() && matrix.example == 'parcels' }}
        uses: ./.github/actions/go-cache
        with:
          build: acceptance
          mode: save
          modules: "false"

  release-check:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go goreleaser"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: goreleaser check
      - run: GORELEASER_CURRENT_TAG=$(scripts/cli-tag.sh) goreleaser build --snapshot --clean --single-target

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:rhysd/actionlint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: mise exec aqua:rhysd/actionlint -- actionlint
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # Security audit of every workflow (template injection, permissions, pinning...).
      - run: uvx zizmor --offline --min-severity medium --format github .github/workflows

  # Single required status check; keeps branch protection simple as jobs are added. A job a
  # pull request does not need is skipped, which passes.
  ci-ok:
    if: always()
    needs: [changes, hygiene, lint, workflows, test, integration, web, mobile, android, ios, cross-build, example-app, acceptance, release-check]
    runs-on: ubuntu-24.04
    steps:
      - name: all jobs passed
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
