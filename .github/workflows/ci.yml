name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a pull request needs, from the files it changes (scripts/ci-changes.sh). Pushes
  # to main and the merge queue run every job, and so does a change to CI itself.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.changes.outputs.go }}
      integration: ${{ steps.changes.outputs.integration }}
      web: ${{ steps.changes.outputs.web }}
      examples: ${{ steps.changes.outputs.examples }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      # A pull request is checked out as its merge into the base branch, the merge's first
      # parent: the two differ by what the pull request changes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$files" | scripts/ci-changes.sh
          else
            scripts/ci-changes.sh --all
          fi | tee -a "$GITHUB_OUTPUT"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "aqua:gitleaks/gitleaks"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: scripts/hygiene.sh
      - name: gitleaks (history)
        run: gitleaks git --no-banner --redact .

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go golangci-lint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: lint
          extra-paths: ~/.cache/golangci-lint
      - run: go mod tidy -diff
      - name: generated files are up to date
        run: |
          go generate ./...
          # untracked files count too (a newly generated page must be committed)
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: golangci-lint run
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # This job keeps Linux's module cache (see .github/actions/go-cache).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: lint
          mode: save
          extra-paths: ~/.cache/golangci-lint

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows scans every file the checkout, the cache restore and the build write, which
      # makes them slow: its real-time scanning is off on this runner, which lasts one job.
      - if: runner.os == 'Windows'
        name: stop Windows Defender's real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - run: go test -race ./...
      # On macOS and Windows this job keeps the module cache too (lint does on Linux).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: test
          mode: save
          modules: ${{ runner.os != 'Linux' }}

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    # Packs against real services (PostgreSQL, MongoDB, Kafka, WireMock, the cloud emulators)
    # via testcontainers. It reads the test job's cache.
    runs-on: ubuntu-latest
    steps:
      # The services' images and the race-detector builds need more disk than a runner has
      # free: remove toolchains the job never uses, in the background while the job sets up.
      - name: free disk space (in the background)
        run: (sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift; touch "$RUNNER_TEMP/disk-freed") > /dev/null 2>&1 &
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - name: wait for the disk space
        run: |
          for _ in $(seq 300); do [ -f "$RUNNER_TEMP/disk-freed" ] && break; sleep 2; done
          [ -f "$RUNNER_TEMP/disk-freed" ] || { echo "::error::the disk space was not freed within 10 minutes"; exit 1; }
          df -h /
      # The web pack has a job of its own (web).
      - run: |
          mapfile -t packs < <(go list ./packs/... | grep -v /packs/web)
          go test -race -tags integration -timeout 20m "${packs[@]}" ./internal/engine/... ./internal/packbuild/...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # The web pack in Chromium, Firefox and WebKit, which it downloads on first use; the watching
    # test opens browser windows, on a virtual screen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: test
      # The browsers, and the Playwright driver, Node.js, axe-core and Lighthouse axx prepares,
      # by their versions. Saved only on pushes to main, like Go's caches.
      - id: web-tools
        name: the versions of the web packs' downloads
        run: |
          versions=$({
            grep -hE '(CoreVersion|NodeVersion|patchRevision|lighthouseVersion) *=|Name: "axe-core"' \
              packs/web/internal/driver/*.go packs/web/lighthouse/install.go packs/web/a11y/a11y.go
            sha256sum packs/web/lighthouse/npm/package-lock.json
          } | sha256sum | cut -c1-16)
          echo "key=web-tools-${RUNNER_OS}-${versions}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/axx/web
          key: ${{ steps.web-tools.outputs.key }}
      - name: the browsers' system libraries
        run: |
          version=$(sed -n 's/^\tCoreVersion = "\(.*\)"$/\1/p' packs/web/internal/driver/driver.go)
          sudo npx -y "playwright@$version" install-deps chromium firefox webkit
      - run: xvfb-run -a go test -race -tags integration -timeout 20m ./packs/web/...
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        # A cache is an optimization: failing to save it fails nothing.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/axx/web
          key: ${{ steps.web-tools.outputs.key }}

  cross-build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # CGO_ENABLED=0 must keep working for every release target. Built with -trimpath like
    # GoReleaser, so release-check and the release dry run reuse this job's build cache.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/axx
          done
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: cross
          mode: save
          modules: "false"

  example-app:
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    # The services the examples test are Go modules of their own.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [parcels, parcel-claims, carrier-billing, customs-clearance]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go golangci-lint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: go mod tidy -diff
      - run: go test ./...
      - run: golangci-lint run

  release-check:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go goreleaser"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: goreleaser check
      - run: GORELEASER_CURRENT_TAG=$(scripts/cli-tag.sh) goreleaser build --snapshot --clean --single-target

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "aqua:rhysd/actionlint"
          # Tools are cached from main only: pull requests read them.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: mise exec aqua:rhysd/actionlint -- actionlint
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      # Security audit of every workflow (template injection, permissions, pinning...).
      - run: uvx zizmor --offline --min-severity medium --format github .github/workflows

  # Single required status check; keeps branch protection simple as jobs are added. A job a
  # pull request does not need is skipped, which passes.
  ci-ok:
    if: always()
    needs: [changes, hygiene, lint, workflows, test, integration, web, cross-build, example-app, release-check]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
