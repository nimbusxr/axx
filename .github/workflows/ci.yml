name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "aqua:gitleaks/gitleaks"
      - run: scripts/hygiene.sh
      - name: gitleaks (history)
        run: gitleaks git --no-banner --redact .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go golangci-lint"
      - uses: ./.github/actions/go-cache
        with:
          build: lint
          extra-paths: ~/.cache/golangci-lint
      - run: go mod tidy -diff
      - name: generated files are up to date
        run: |
          go generate ./...
          # untracked files count too (a newly generated page must be committed)
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: golangci-lint run
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # This job keeps Linux's module cache (see .github/actions/go-cache).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: lint
          mode: save
          extra-paths: ~/.cache/golangci-lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go"
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - run: go test -race ./...
      # On macOS and Windows this job keeps the module cache too (lint does on Linux).
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: test
          mode: save
          modules: ${{ runner.os != 'Linux' }}

  integration:
    # Packs against real services (PostgreSQL, MongoDB, Kafka, WireMock, the cloud emulators)
    # via testcontainers. It reads the test job's cache.
    runs-on: ubuntu-latest
    steps:
      # The services' images and the race-detector builds need more disk than a runner has
      # free: remove toolchains the job never uses.
      - name: free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go"
      - uses: ./.github/actions/go-cache
        with:
          build: test
      - run: go test -race -tags integration -timeout 20m ./packs/... ./internal/engine/... ./internal/packbuild/...

  cross-build:
    # CGO_ENABLED=0 must keep working for every release target. Built with -trimpath like
    # GoReleaser, so release-check and the release dry run reuse this job's build cache.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go"
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/axx
          done
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          build: cross
          mode: save
          modules: "false"

  example-app:
    # The services the examples test are Go modules of their own.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [parcels, parcel-claims, carrier-billing, customs-clearance]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go golangci-lint"
      - run: go mod tidy -diff
      - run: go test ./...
      - run: golangci-lint run

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "go goreleaser"
      - uses: ./.github/actions/go-cache
        with:
          build: cross
      - run: goreleaser check
      - run: GORELEASER_CURRENT_TAG=$(scripts/cli-tag.sh) goreleaser build --snapshot --clean --single-target

  # Single required status check; keeps branch protection simple as jobs are added.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: "aqua:rhysd/actionlint"
      - run: mise exec aqua:rhysd/actionlint -- actionlint
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      # Security audit of every workflow (template injection, permissions, pinning...).
      - run: uvx zizmor --offline --min-severity medium --format github .github/workflows

  ci-ok:
    if: always()
    needs: [hygiene, lint, workflows, test, integration, cross-build, release-check]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
