# TEMPORARY: the docs' cache recipe, held to a real round trip on a GitHub runner: one job
# prepares and saves, the next restores on a fresh runner. Removed before this pull request is ready.
name: tmp-cache-probe

on:
  pull_request:
    paths:
      - .github/workflows/tmp-cache-probe.yml

permissions:
  contents: read

jobs:
  first:
    name: a first run, nothing kept
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "go"
          cache: false
      - name: axx, as a release installs it
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/nimbusxr/axx/internal/version.Version=0.8.0" -o "$RUNNER_TEMP/bin/axx" ./cmd/axx
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/axx/builds
            ~/.cache/axx/go
            ~/.cache/axx/versions
          key: tmp-axx-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: the project, and its first run
        run: |
          export PATH="$RUNNER_TEMP/bin:/usr/bin:/bin:/usr/local/bin"; unset GOROOT GOBIN GOPATH GOFLAGS
          mkdir -p "$RUNNER_TEMP/proj"; cd "$RUNNER_TEMP/proj"
          axx init --no-agents --no-ci > /dev/null
          printf 'packs:\n  - rest\n  - sql\n  - web-core\n' > axx-packs.yaml
          axx pack new steps > /dev/null 2>&1
          s=$SECONDS; axx validate; echo "first run: $((SECONDS - s))s"
          du -sm ~/.cache/axx/* | sed 's/^/MB /'
  second:
    name: the next run, on a fresh runner
    needs: first
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "go"
          cache: false
      - name: axx, as a release installs it
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/nimbusxr/axx/internal/version.Version=0.8.0" -o "$RUNNER_TEMP/bin/axx" ./cmd/axx
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/axx/builds
            ~/.cache/axx/go
            ~/.cache/axx/versions
          key: tmp-axx-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: the project again, and its run
        run: |
          export PATH="$RUNNER_TEMP/bin:/usr/bin:/bin:/usr/local/bin"; unset GOROOT GOBIN GOPATH GOFLAGS
          mkdir -p "$RUNNER_TEMP/proj"; cd "$RUNNER_TEMP/proj"
          axx init --no-agents --no-ci > /dev/null
          printf 'packs:\n  - rest\n  - sql\n  - web-core\n' > axx-packs.yaml
          ls ~/.cache/axx/builds
          s=$SECONDS; new=$(axx pack new steps 2>&1); echo "$new"; echo "the pack written again: $((SECONDS - s))s"
          s=$SECONDS; out=$(axx validate 2>&1); echo "$out"; echo "this run: $((SECONDS - s))s"
          if echo "$new$out" | grep -q preparing; then echo "::error::a fresh runner with the cache restored prepared again"; exit 1; fi
          printf '\n// a change\n' >> steps/pack.go
          s=$SECONDS; axx validate; echo "a changed pack: $((SECONDS - s))s"
