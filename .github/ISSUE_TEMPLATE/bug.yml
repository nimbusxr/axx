name: Bug report
description: Something in axx behaves incorrectly.
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest feature file + axx.yaml that shows the problem.
      render: gherkin
    validations: {required: true}
  - type: textarea
    id: version
    attributes:
      label: "`axx version --json` and `axx doctor --json`"
      render: json
    validations: {required: true}
