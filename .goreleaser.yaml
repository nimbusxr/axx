# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: axx
# Always GitHub, whatever tokens the environment holds.
force_token: github
# The CLI's versions are the v* tags. The other components are tagged on the same commits
# (wiremock-openapi-v…, intellij-v…), so builds without a release tag set
# GORELEASER_CURRENT_TAG to the newest v* tag (see scripts/cli-tag.sh).

before:
  hooks:
    - go mod tidy

builds:
  - id: axx
    main: ./cmd/axx
    binary: axx
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/nimbusxr/axx/internal/version.Version={{ .Version }}
      - -X github.com/nimbusxr/axx/internal/version.Commit={{ .FullCommit }}
      - -X github.com/nimbusxr/axx/internal/version.Date={{ .CommitDate }}

# The macOS binaries, signed with NimbusXR's Developer ID and sent to Apple's notary service (ADR
# 0016), when the release environment's key is here: a dry run has none. GoReleaser does not wait
# for Apple, as a job must end within 10 minutes: the release's notarized job does
# (scripts/notarized.sh). Signed before they are archived, they are what checksums.txt covers.
notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_DEVELOPER_ID_P12" }}'
      ids: [axx]
      sign:
        certificate: "{{ .Env.APPLE_DEVELOPER_ID_P12 }}"
        password: "{{ .Env.APPLE_DEVELOPER_ID_P12_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.APPLE_API_ISSUER_ID }}"
        key_id: "{{ .Env.APPLE_API_KEY_ID }}"
        key: "{{ .Env.APPLE_API_KEY_PATH }}"
        wait: false

archives:
  - id: axx
    name_template: "axx_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

dockers_v2:
  - images: [ghcr.io/nimbusxr/axx]
    # The version without the v, like the axx-wiremock image: 0.1.0, 0.1 and latest.
    tags: ["{{ .Version }}", "{{ .Major }}.{{ .Minor }}", "{{ if not .IsSnapshot }}latest{{ end }}"]
    platforms: [linux/amd64, linux/arm64]
    dockerfile: build/Dockerfile
    labels:
      org.opencontainers.image.source: https://github.com/nimbusxr/axx
      org.opencontainers.image.description: Behavioral verification for agentic software factories
      org.opencontainers.image.licenses: Apache-2.0

homebrew_casks:
  - name: axx
    binaries: [axx]
    homepage: https://axx.nimbusxr.us
    description: Behavioral verification for agentic software factories
    license: Apache-2.0
    skip_upload: auto
    # The macOS binaries are signed and notarized (notarize, above), so macOS runs them as
    # Homebrew downloads them, quarantined.
    repository:
      owner: nimbusxr
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

release:
  github:
    owner: nimbusxr
    name: axx
  # release-please creates the GitHub release and notes; we only attach assets.
  mode: keep-existing
  # every 0.x release is a GitHub pre-release until v1.0.0
  prerelease: "true"

changelog:
  disable: true
