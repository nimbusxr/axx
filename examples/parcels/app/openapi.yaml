openapi: 3.1.0
info:
  title: Parcels
  version: 1.0.0
  description: >-
    Quote and register parcels for delivery, change or cancel them before pickup, read their
    tracking summary and shipping label, and follow their depot scans as they happen. Every
    quote and registration checks the recipient's postcode with the address service, and
    every registration is announced as a ParcelRegistered event. The courier calls back,
    signed, as it collects and delivers parcels; the shops' own systems read their parcels
    with a token.
paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [UP]}
  /api/quotes:
    post:
      operationId: quoteParcel
      summary: Price a parcel before registering it
      description: >-
        The price depends on the service level, the weight, whether the parcel goes abroad and
        whether the address service places the postcode in a remote zone. Undeliverable
        postcodes are refused with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuoteRequest"}
            examples:
              Domestic parcel:
                value:
                  weightGrams: 1200
                  serviceLevel: STANDARD
                  recipient:
                    postcode: "10115"
                    country: DE
              Express abroad:
                value:
                  weightGrams: 800
                  serviceLevel: EXPRESS
                  recipient:
                    postcode: "75001"
                    country: FR
      responses:
        "200":
          description: The price.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quote"}
        "400": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/parcels:
    post:
      operationId: registerParcel
      summary: Register a parcel
      description: >-
        The recipient's postcode is checked with the address service first; parcels to
        undeliverable postcodes are refused with 422. References are unique: registering
        an existing reference is refused with 409. A retry sent with the Idempotency-Key of
        a registration the shop already made is answered with the parcel it made (200).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: The shop's own key for the registration; kept for a day.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ParcelRequest"}
            examples:
              Standard parcel:
                value:
                  reference: PX-EXAMPLE-1
                  sender: shop-example
                  weightGrams: 1200
                  serviceLevel: STANDARD
                  recipient:
                    name: Ada Lovelace
                    street: Invalidenstrasse 116
                    city: Berlin
                    postcode: "10115"
                    country: DE
              Express parcel:
                value:
                  reference: PX-EXAMPLE-2
                  sender: shop-example
                  weightGrams: 800
                  serviceLevel: EXPRESS
                  recipient:
                    name: Grace Hopper
                    city: Paris
                    postcode: "75001"
                    country: FR
      responses:
        "200":
          description: A retry of a registration made with the same Idempotency-Key; the parcel it made.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Parcel"}
        "201":
          description: Registered.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Parcel"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503":
          description: The parcel could not be stored; try again later.
          headers:
            Retry-After:
              schema: {type: string}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
    get:
      operationId: listParcels
      summary: List parcels, oldest first
      parameters:
        - name: sender
          in: query
          required: false
          description: Only this sender's parcels.
          schema: {type: string}
      responses:
        "200":
          description: The parcels.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Parcel"}
  /api/parcels/{reference}:
    parameters:
      - $ref: "#/components/parameters/Reference"
    get:
      operationId: getParcel
      summary: Fetch a parcel
      responses:
        "200":
          description: The parcel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Parcel"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: changeParcel
      summary: Change a parcel before pickup
      description: >-
        Only parcels with status REGISTERED can be changed, and not while the depot is
        dispatching them (409 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ParcelChange"}
            examples:
              Heavier:
                value:
                  weightGrams: 2500
      responses:
        "200":
          description: The changed parcel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Parcel"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: cancelParcel
      summary: Cancel a parcel before pickup
      responses:
        "204":
          description: Cancelled.
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/parcels/{reference}/tracking:
    parameters:
      - $ref: "#/components/parameters/Reference"
    get:
      operationId: getTracking
      summary: The parcel's tracking summary (from depot scans)
      responses:
        "200":
          description: The tracking summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tracking"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/parcels/{reference}/events:
    parameters:
      - $ref: "#/components/parameters/Reference"
    get:
      operationId: followTracking
      summary: The parcel's depot scans as they happen (server-sent events)
      description: >-
        A `scan` event for the parcel's latest scan and each new one, then a `delivered`
        event, which ends the stream. Each event's data is JSON with the parcel's
        `reference`, `status`, `location` and `scannedAt`; its id is the number of scans so
        far. A comment every 15 seconds keeps a quiet stream open.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: {type: string}
        "404": {$ref: "#/components/responses/Problem"}
  /api/parcels/{reference}/label:
    parameters:
      - $ref: "#/components/parameters/Reference"
    get:
      operationId: getLabel
      summary: The parcel's shipping label
      responses:
        "200":
          description: The label.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Label"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/courier/callbacks:
    post:
      operationId: courierCallback
      summary: The courier's status callbacks
      description: >-
        The courier calls back as it collects and delivers parcels. A callback is signed in
        X-Courier-Signature: `sha256=` and the hex HMAC-SHA256 of the body, with the key the
        courier and the service share. A delivery is told to the parcel's shop before the
        callback is answered.
      parameters:
        - name: X-Courier-Signature
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CourierCallback"}
            examples:
              Collected:
                value:
                  reference: PX-EXAMPLE-1
                  status: COLLECTED
                  location: Leipzig depot
                  at: "2026-09-28T09:40:00Z"
              Delivered:
                value:
                  reference: PX-EXAMPLE-1
                  status: DELIVERED
                  location: Leipzig
                  at: "2026-09-28T14:05:00Z"
      responses:
        "204":
          description: The status is recorded.
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/couriers/sign-in:
    post:
      operationId: courierSignIn
      summary: A courier signs in to the couriers' app
      description: >-
        The couriers' app is the handheld a courier delivers with. A courier signs in with
        their courier ID and PIN, and gets a token for a working day.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CourierSignIn"}
            examples:
              Hanna:
                value: {courier: CR-LEJ-12, pin: "4711"}
      responses:
        "200":
          description: The courier's token and name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CourierSession"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/couriers/{courier}/deliveries:
    parameters:
      - $ref: "#/components/parameters/Courier"
    get:
      operationId: listCourierDeliveries
      summary: The parcels a courier delivers today
      description: >-
        The parcels out for delivery with the courier and not delivered yet, oldest first.
        Needs the courier's token.
      security:
        - courierToken: []
      responses:
        "200":
          description: The courier's deliveries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CourierDeliveries"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/couriers/{courier}/deliveries/{reference}:
    parameters:
      - $ref: "#/components/parameters/Courier"
      - $ref: "#/components/parameters/Reference"
    post:
      operationId: confirmCourierDelivery
      summary: A courier confirms a delivery
      description: >-
        The parcel is delivered, signed for by someone: the service records it as it records
        the confirmations the couriers' handhelds publish over NATS, and tells the parcel's
        shop. Needs the courier's token.
      security:
        - courierToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeliveryConfirmation"}
            examples:
              Signed:
                value: {signedBy: H. Wolf}
      responses:
        "200":
          description: The parcel is delivered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeliveryConfirmed"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/shops/{shop}/parcels:
    parameters:
      - name: shop
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listShopParcels
      summary: A shop's parcels, for the shop's own systems
      description: >-
        Needs a shop's token: a JSON Web Token signed with HS256 whose shop claim names the
        shop, from POST /oauth/token or the shop's platform.
      security:
        - shopToken: []
      responses:
        "200":
          description: The shop's parcels, oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShopParcels"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /oauth/token:
    post:
      operationId: issueToken
      summary: A token for a shop's system (OAuth 2.0 client credentials)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type: {type: string, enum: [client_credentials]}
                client_id: {type: string, description: The shop's name.}
                client_secret: {type: string}
      responses:
        "200":
          description: The token, which lasts an hour.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, enum: [Bearer]}
                  expires_in: {type: integer}
        "400":
          description: Not a client credentials request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthError"}
        "401":
          description: The client's credentials are not a shop's.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthError"}
  /api/assistant/address:
    post:
      operationId: readAddress
      summary: The recipient's address in a shop's note
      description: >-
        The parcel assistant asks a model to read the recipient's name and address in the free
        text a shop attached to a parcel. A note it cannot read an address in is refused with
        422, for the shop to check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 1}
            examples:
              A shop's note:
                value:
                  note: "Please deliver to Mara Lindqvist, Birkenallee 3, 01067 Dresden. Ring twice."
      responses:
        "200":
          description: The address.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recipient"}
        "400": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Busy"}
  /api/assistant/questions:
    post:
      operationId: askAssistant
      summary: An answer to a recipient's question about a parcel
      description: >-
        The parcel assistant asks a model, which looks the parcel up before it answers. The model
        learns the parcel's status and its last scan, never the recipient's name or street.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string, minLength: 1}
            examples:
              Where is my parcel:
                value:
                  question: "Where is my parcel PX-1042?"
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                required: [answer]
                properties:
                  answer: {type: string}
        "400": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Busy"}
components:
  securitySchemes:
    shopToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    courierToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Courier:
      name: courier
      in: path
      required: true
      schema: {type: string}
    Reference:
      name: reference
      in: path
      required: true
      schema: {type: string}
  responses:
    Problem:
      description: The request was refused (RFC 9457 problem details).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Busy:
      description: The model is busy, even after one more try; try again later.
      headers:
        Retry-After:
          description: The seconds to wait.
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    CourierSignIn:
      type: object
      required: [courier, pin]
      properties:
        courier: {type: string, minLength: 1}
        pin: {type: string, minLength: 1}
    CourierSession:
      type: object
      required: [token, courier, name, expiresIn]
      properties:
        token: {type: string}
        courier: {type: string}
        name: {type: string}
        expiresIn: {type: integer}
    CourierDeliveries:
      type: object
      required: [courier, deliveries]
      properties:
        courier: {type: string}
        deliveries:
          type: array
          items:
            type: object
            required: [reference, serviceLevel, recipient]
            properties:
              reference: {type: string}
              serviceLevel: {type: string, enum: [STANDARD, EXPRESS]}
              recipient: {$ref: "#/components/schemas/Recipient"}
    DeliveryConfirmation:
      type: object
      required: [signedBy]
      properties:
        signedBy: {type: string, minLength: 1}
        location: {type: string, description: Where the parcel was delivered; the recipient's city by default.}
    DeliveryConfirmed:
      type: object
      required: [reference, status, signedBy, location]
      properties:
        reference: {type: string}
        status: {type: string, enum: [DELIVERED]}
        signedBy: {type: string}
        location: {type: string}
    Recipient:
      type: object
      required: [name, postcode, country]
      properties:
        name: {type: string, minLength: 1}
        street: {type: [string, "null"]}
        city: {type: [string, "null"]}
        postcode: {type: string, minLength: 1}
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country code.
    QuoteRequest:
      type: object
      required: [weightGrams, recipient]
      properties:
        weightGrams: {type: integer, minimum: 1, maximum: 30000}
        serviceLevel:
          type: string
          enum: [STANDARD, EXPRESS]
          default: STANDARD
        recipient:
          type: object
          required: [postcode, country]
          properties:
            postcode: {type: string, minLength: 1}
            country: {type: string, pattern: "^[A-Z]{2}$"}
    Quote:
      type: object
      required: [zone, serviceLevel, weightGrams, priceCents, currency, deliveryDays]
      properties:
        zone: {type: string}
        serviceLevel: {type: string}
        weightGrams: {type: integer}
        priceCents: {type: integer}
        currency: {type: string, enum: [EUR]}
        deliveryDays: {type: integer, minimum: 1}
    ParcelRequest:
      type: object
      required: [reference, sender, weightGrams, recipient]
      properties:
        reference:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{2,39}$"
          description: The sender's unique reference for the parcel.
        sender: {type: string, minLength: 1}
        weightGrams: {type: integer, minimum: 1, maximum: 30000}
        serviceLevel:
          type: string
          enum: [STANDARD, EXPRESS]
          default: STANDARD
        recipient: {$ref: "#/components/schemas/Recipient"}
    ParcelChange:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        weightGrams: {type: integer, minimum: 1, maximum: 30000}
        serviceLevel: {type: string, enum: [STANDARD, EXPRESS]}
        recipient: {$ref: "#/components/schemas/Recipient"}
    Parcel:
      type: object
      required: [reference, sender, status, weightGrams, serviceLevel, recipient, zone, source, createdAt, updatedAt]
      properties:
        reference: {type: string}
        sender: {type: string}
        status:
          type: string
          enum: [REGISTERED, IN_TRANSIT, DELIVERED]
        weightGrams: {type: integer}
        serviceLevel: {type: string}
        recipient: {$ref: "#/components/schemas/Recipient"}
        zone:
          type: string
          description: Delivery zone from the address service.
        source:
          type: string
          enum: [api, manifest]
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Tracking:
      type: object
      required: [parcelRef, status, lastLocation, lastScanAt, scanCount, delivered]
      properties:
        parcelRef: {type: string}
        status: {type: string}
        lastLocation: {type: [string, "null"]}
        lastScanAt: {type: [string, "null"], format: date-time}
        scanCount: {type: integer, minimum: 0}
        delivered: {type: boolean}
    Label:
      type: object
      required: [reference, serviceLevel, barcode, signature]
      properties:
        reference: {type: string}
        serviceLevel: {type: string}
        barcode:
          type: string
          pattern: "^PX[0-9]{11}$"
        signature:
          type: string
          pattern: "^[0-9a-f]{64}$"
    CourierCallback:
      type: object
      required: [reference, status]
      properties:
        reference: {type: string}
        status: {type: string, enum: [COLLECTED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED]}
        location: {type: string}
        at: {type: string, format: date-time}
    ShopParcels:
      type: object
      required: [shop, parcels]
      properties:
        shop: {type: string}
        parcels:
          type: array
          items:
            type: object
            required: [reference, status, serviceLevel, weightGrams]
            properties:
              reference: {type: string}
              status: {type: string}
              serviceLevel: {type: string}
              weightGrams: {type: integer}
    OAuthError:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
