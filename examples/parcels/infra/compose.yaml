# The parcels service and everything it needs.
#
#   docker compose up --build --wait     # start everything and wait until it is healthy
#   docker compose down -v               # stop and remove containers and volumes
#
# axx runs this for you: see ../acceptance/axx.yaml. The published host ports are the
# ones the feature files use (8400, 8410, 4000, 8081, 8082, 8083, 8084, 8085, 8086, 5432, 27017,
# 9092, 9081, 5672, 1883, 4222, 6379 and 1143, and the mail server's SMTP on 1025 and web
# interface on 8025).
name: parcels

services:
  # The downstream address service, mocked by WireMock with axx's OpenAPI validation
  # extension: every call is checked against openapi/address-service.yaml. In report
  # mode the service gets the stub's real answer, and axx fails the scenario (or the
  # run) with the contract violation. This builds the extension from this repository;
  # `image: ghcr.io/nimbusxr/axx-wiremock:<version>` can replace `build:`.
  address-service:
    build:
      context: ../../../extensions/wiremock-openapi
    ports:
      - '8081:8080'
    environment:
      OPENAPI_VALIDATION_MODE: report
      OPENAPI_SPEC_SOURCE: /var/openapi/address-service.yaml
    volumes:
      - './wiremock:/home/wiremock'
      - './openapi:/var/openapi:ro'
    command: --verbose
    healthcheck:
      # The image (Alpine JRE) ships wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__admin/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    stop_signal: SIGKILL

  # The courier company, mocked the same way against openapi/courier.yaml: the
  # service books express collections and notes the pickups shops plan there.
  courier:
    build:
      context: ../../../extensions/wiremock-openapi
    ports:
      - '8082:8080'
    environment:
      OPENAPI_VALIDATION_MODE: report
      OPENAPI_SPEC_SOURCE: /var/openapi/courier.yaml
    volumes:
      - './courier:/home/wiremock'
      - './openapi:/var/openapi:ro'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__admin/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    stop_signal: SIGKILL

  # The shops' systems, where the service tells each shop of its parcels' deliveries,
  # mocked the same way against openapi/shop-webhooks.yaml.
  shops:
    build:
      context: ../../../extensions/wiremock-openapi
    ports:
      - '8083:8080'
    environment:
      OPENAPI_VALIDATION_MODE: report
      OPENAPI_SPEC_SOURCE: /var/openapi/shop-webhooks.yaml
    volumes:
      - './shops:/home/wiremock'
      - './openapi:/var/openapi:ro'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__admin/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    stop_signal: SIGKILL

  # The partner carrier's rating service, which prices the parcels going beyond the EU over
  # gRPC, mocked by WireMock's gRPC extension (in the same image) from the descriptor set in
  # rating/grpc (see ../app/gen/gen.go). The stubs in rating/mappings answer per country.
  rating:
    build:
      context: ../../../extensions/wiremock-openapi
    ports:
      - '8084:8080'
    volumes:
      - './rating:/home/wiremock'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__admin/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    stop_signal: SIGKILL

  # The shops subgraph, which another team owns, mocked by the GraphQL extension of the same
  # WireMock image: field by field from shop-directory/graphql/shops.graphql, its entities from
  # the stubs in shop-directory/mappings.
  shop-directory:
    build:
      context: ../../../extensions/wiremock-openapi
    ports:
      - '8085:8080'
    environment:
      GRAPHQL_SCHEMA_SOURCE: /home/wiremock/graphql/shops.graphql
    volumes:
      - './shop-directory:/home/wiremock'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__admin/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    stop_signal: SIGKILL

  # The model the parcel assistant asks, mocked by the model mock of the same WireMock image:
  # the stubs in models/mappings answer requests about the scenarios' notes and parcels, in
  # the format of the request (the service speaks OpenAI's API).
  models:
    build:
      context: ../../../extensions/wiremock-openapi
    ports:
      - '8086:8080'
    volumes:
      - './models:/home/wiremock'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__admin/health"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s
    stop_signal: SIGKILL

  # The parcels supergraph, composed from the subgraphs' SDL, the service's own
  # (../app/graph/schema.graphqls) and the shops subgraph's, as a team composes in CI.
  supergraph:
    build: ./supergraph
    environment:
      PARCELS_SUBGRAPH_URL: ${PARCELS_SUBGRAPH_URL:-http://app:8400/graphql}
    volumes:
      - '../app/graph/schema.graphqls:/subgraphs/parcels.graphqls:ro'
      - './shop-directory/graphql/shops.graphql:/subgraphs/shops.graphql:ro'
      - 'supergraph:/supergraph'

  # The federated graph's gateway, Hive Gateway, on port 4000: queries across the parcels
  # subgraph and the shops subgraph go through it.
  gateway:
    image: 'ghcr.io/graphql-hive/gateway:2.15.1'
    command: ['supergraph', '/supergraph/supergraph.graphql', '--port', '4000']
    ports:
      - '4000:4000'
    volumes:
      - 'supergraph:/supergraph:ro'
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      supergraph:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/readiness"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 5s

  postgres:
    image: 'postgres:16'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: parcels
      POSTGRES_USER: parcels
      POSTGRES_PASSWORD: parcels
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - './postgres/init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "parcels", "-d", "parcels"]
      interval: 1s
      timeout: 1s
      retries: 60
    stop_signal: SIGKILL

  mongo:
    image: 'mongo:7'
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: parcels
      MONGO_INITDB_ROOT_PASSWORD: parcels
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
    stop_signal: SIGKILL

  # Single-node KRaft broker. Clients on the host use localhost:9092 (PLAINTEXT);
  # containers use kafka:9094 (INTERNAL). Set LOCAL_HOST to advertise another host name.
  kafka:
    image: 'apache/kafka-native:3.9.1'
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,INTERNAL://kafka:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${LOCAL_HOST:-localhost}:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 kafka 9092 && nc -z -w 2 kafka 9094"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 2s
    stop_signal: SIGKILL

  schema-registry:
    image: 'confluentinc/cp-schema-registry:7.9.2-1-ubi8'
    ports:
      - '9081:8081'
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9094
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_ADVERTISED_LISTENERS: http://schema-registry:8081
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/subjects"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
    stop_signal: SIGKILL

  # Label printing: print jobs and the printers' reports (AMQP 0-9-1).
  rabbitmq:
    image: 'rabbitmq:4.2.9-alpine'
    ports:
      - '5672:5672'
    environment:
      RABBITMQ_DEFAULT_USER: parcels
      RABBITMQ_DEFAULT_PASS: parcels
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 5s
    stop_signal: SIGKILL

  # The depots' handheld scanners publish their scans here (MQTT 5).
  mosquitto:
    image: 'eclipse-mosquitto:2.0.22'
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - '1883:1883'
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-t", "health", "-m", "ok"]
      interval: 1s
      timeout: 2s
      retries: 60
    stop_signal: SIGKILL

  # Couriers' delivery confirmations, and every tracking update in the TRACKING
  # stream (NATS with JetStream).
  nats:
    image: 'nats:2.15.0-alpine'
    command: ["nats-server", "-js", "-m", "8222"]
    ports:
      - '4222:4222'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 1s
      timeout: 2s
      retries: 60
    stop_signal: SIGKILL

  # The service's cache: tracking views, and idempotency keys (Valkey, which speaks
  # Redis's protocol).
  valkey:
    image: 'valkey/valkey:9.1.2-alpine'
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 60
    stop_signal: SIGKILL

  # The service's mail server in the tests: smtp4dev catches every email it sends, for the
  # features to read over IMAP (1143), and stubs the mail servers of the shops as WireMock's
  # mappings stub the HTTP dependencies: its recipient expression refuses the mail of the
  # recipients it names, with the code it gives. Its web interface is on 8025.
  mail:
    image: 'rnwood/smtp4dev:3.15.0'
    ports:
      - '1025:25'
      - '1143:143'
      - '8025:80'
    environment:
      # quince-and-quill's mail server is busy: it asks to be tried again later.
      ServerOptions__RecipientValidationExpression: >-
        recipient.toLowerCase().endsWith("@quince-and-quill.example")
        ? error(451, "Mailbox busy, try again later") : true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/api/server"]
      interval: 1s
      timeout: 2s
      retries: 60
    stop_signal: SIGKILL

  # The export folder the service writes the manifests' documents to (./exports, the
  # exports folder in the features), emptied for every run so that no document of an
  # earlier run passes a check, and writable by the service's non-root user.
  exports:
    image: 'busybox:1.37'
    volumes:
      - './exports:/exports'
    command: ['sh', '-c', 'rm -rf /exports/* && chmod 777 /exports']

  # The system under test, built from ../app. Its defaults reach the ports above on
  # localhost (for running it on the host); here it uses the compose service names.
  app:
    build: ../app
    ports:
      - '8400:8400'
      # The tracking API, over gRPC.
      - '8410:8410'
    environment:
      PARCELS_DB_URL: postgres://parcels:parcels@postgres:5432/parcels?sslmode=disable
      PARCELS_MONGO_URI: mongodb://parcels:parcels@mongo:27017/?authSource=admin
      PARCELS_ADDRESS_URL: http://address-service:8080
      PARCELS_COURIER_URL: http://courier:8080
      PARCELS_RATING_ADDR: rating:8080
      PARCELS_KAFKA_BROKERS: kafka:9094
      PARCELS_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PARCELS_AMQP_URL: amqp://parcels:parcels@rabbitmq:5672/
      PARCELS_MQTT_URL: mqtt://mosquitto:1883
      PARCELS_NATS_URL: nats://nats:4222
      PARCELS_SHOP_WEBHOOK_URL: http://shops:8080/webhooks
      PARCELS_REDIS_URL: redis://valkey:6379/0
      PARCELS_SMTP_ADDR: mail:25
      PARCELS_EXPORT_DIR: /var/lib/parcels/exports
      PARCELS_MODEL_URL: http://models:8080/v1
      # Every log line also goes to the log service axx runs on the host (the
      # parcels log in the features); host-gateway makes the name work on Linux.
      PARCELS_LOG_UDP: host.docker.internal:5140
    volumes:
      - './exports:/var/lib/parcels/exports'
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      exports:
        condition: service_completed_successfully
      address-service:
        condition: service_healthy
      courier:
        condition: service_healthy
      shops:
        condition: service_healthy
      rating:
        condition: service_healthy
      models:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mail:
        condition: service_healthy

volumes:
  # The composed supergraph, from the supergraph service to the gateway.
  supergraph:
