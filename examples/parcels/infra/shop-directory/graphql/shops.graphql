# The shops subgraph, which another team owns: the shops' names and tiers. WireMock mocks it
# field by field from this schema (GRAPHQL_SCHEMA_SOURCE); the stubs in ../mappings answer
# its entities.
extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

type Query {
  shop(id: ID!): Shop
}

type Shop @key(fields: "id") {
  id: ID!
  name: String!
  tier: Tier!
}

enum Tier {
  STANDARD
  GOLD
}
