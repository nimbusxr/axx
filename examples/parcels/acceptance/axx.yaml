# yaml-language-server: $schema=https://axx.nimbusxr.us/schemas/v0/axx.schema.json
#
# The acceptance suite of the parcels example. From this directory:
#   axx run            # start the service and its infrastructure, run every feature, clean up
#   axx run --debug    # the same, with the service under a Go debugger (see ../README.md)
version: 1

run:
  paths: [features]
  # Scenarios tagged @isolated make the parcels table fail on purpose (database
  # triggers), and those tagged @performance time how fast pages load, which other
  # scenarios' browsers would slow down: they run alone, after the parallel phase.
  exclusive: ["@isolated", "@performance"]

# Each feature keeps the files only it uses next to it (features/manifest-import/seeds/...), and
# its steps name them from there: seeds/manifest-kestrel.yaml. A file not next to the feature is
# looked for in this directory, which holds what several features share: kafka/scan-delivered.json
# and schemas/depot-scan.avsc.
resources: ["."]

# ${sys:...} references in the feature files; override with -D local.host=<name>.
properties:
  local.host: localhost
  # The shop portal, where the browsers find it.
  portal.url: http://localhost:8400/portal
  # The operations desk's command, run in the service's container (from ../infra). Under
  # `axx run --debug` the service runs on the host: -D 'parcels.admin=go run ../app admin'.
  parcels.admin: docker compose exec -T app parcels admin
  # The parcels MCP server over stdio, run the same way: -D 'parcels.mcp=go run ../app mcp' under --debug.
  parcels.mcp: docker compose exec -T app parcels mcp
  # The example's keys (../app/main.go): the courier signs its callbacks with the first, the
  # service signs the shops' webhooks with the second and their tokens with the third, and
  # the wisteria-way shop's system gets its tokens with the last.
  courier.callback-key: example-courier-callback-key
  shops.webhook-key: whsec_ZXhhbXBsZS1zaG9wLXdlYmhvb2sta2V5
  shops.token-key: example-shop-token-key
  shops.wisteria-secret: wisteria-client-secret
  # The couriers' Android app (../courier/android): the emulator's device (AVD) it runs on.
  # Create the device once with ../courier/android/create-emulator.sh, or run on one of
  # yours: -D android.device=<AVD>.
  android.device: parcels-pixel
  # The couriers' iOS app (../courier/ios): the simulators' device type, which axx makes
  # simulators of (Xcode's newest iOS), or one of yours: -D ios.device=<name or UDID>.
  ios.device: iPhone 16
  # The PIN the example couriers sign in with.
  couriers.pin: "4711"

services:
  parcels:
    # ../infra/compose.yaml builds and starts the service and all of its infrastructure.
    dir: ../infra
    command: docker compose up --build
    ready:
      http:
        # The service, and the federated graph's gateway.
        url: [http://localhost:8400/health, http://localhost:4000/readiness]
      timeout: 5m
      interval: 1s
    stop:
      grace: 20s
    cleanup: docker compose down -v --remove-orphans
    # `axx run --debug`: compose starts only the infrastructure (and empties the export
    # folder), and the service runs on the host under Delve, which listens on port 2345
    # for your IDE to attach; it sends its log lines to Axx's UDP listener, as in compose.
    debug:
      command:
        - sh
        - -c
        - >-
          PARCELS_SUBGRAPH_URL=http://host.docker.internal:8400/graphql
          docker compose up --wait address-service courier shops rating shop-directory models partner-carrier postgres mongo kafka schema-registry rabbitmq mosquitto nats valkey mail gateway
          && docker compose up exports
          && cd ../app
          && PARCELS_LOG_UDP=127.0.0.1:5140
          exec dlv debug --headless --listen=127.0.0.1:2345 --api-version=2 --accept-multiclient --continue .
      debugger:
        type: go
        port: 2345
        mode: app-listens

# The portal's screenshots are kept for Linux (CI) and macOS: each is compared on its own
# platform; on others, the screenshot steps pass without comparing.
packs:
  web-screenshots:
    platforms: [linux, darwin]
  # The labels the service draws (manifest-documents.feature), compared where CI and its
  # developers run.
  files:
    screenshots:
      platforms: [linux, darwin]
  # How much of the portal's scripts the scenarios run, in .axx/web/coverage/lcov.info:
  # the scripts the portal serves under /portal/js/ are those of ../app/web/js.
  web-coverage:
    sources:
      /portal/js/: ../app/web/js

# `axx run --profile watch`: the shop portal's browsers open in windows on your screen,
# one scenario at a time and slowed down.
profiles:
  watch:
    run:
      workers: 1
    packs:
      web-core:
        watch: true
        slowdown: 300ms

# `axx lint`: seeds share one database while scenarios run in parallel, so the values
# that identify their rows must not collide across files.
lint:
  include: [axx-lint.generated.yaml]
  # A scenario whose seeds span several files keeps them in a folder of its own
  # (features/courier-app/seeds/courier-app-refresh/): the rules' folder pattern,
  # "features/*/seeds/*/", counts the folder as one file. manifest-import's
  # seeds/manifests/ is no scenario's: it holds the fixtures its factories
  # generate, which axx-lint.generated.yaml's rules check.
  rules:
    - name: Parcel references in seeds
      filePatterns: ["features/*/seeds/*.yaml", "features/*/seeds/*/"]
      excludePatterns: ["features/manifest-import/seeds/manifests/**"]
      regex: '^\s+-?\s*reference:\s*"([^"]+)"'
      description: Every seeded parcel and manifest line has its own reference
      validation: cross-file-unique

    # A courier's deliveries are every parcel given to them: a courier shared by two
    # scenarios shows each the other's parcels. Each scenario signs in once.
    - name: Couriers who sign in
      filePatterns: ["features/*/*.feature"]
      regex: '"Courier ID" field in the courier app is filled with "([^"]+)"'
      description: Every scenario signs in as a courier of its own
      validation: global-unique

    # A seed gives parcels to its own scenario's courier. The list refresh gives its
    # courier a second parcel mid-scenario, from its folder's second file.
    - name: Couriers in seeds
      filePatterns: ["features/*/seeds/*.yaml", "features/*/seeds/*/"]
      excludePatterns: ["features/manifest-import/seeds/manifests/**"]
      regex: '"courier": "([^"]+)"'
      description: Every courier's parcels are one scenario's
      validation: cross-file-unique

    - name: Manifest line ids
      filePatterns: ["features/*/seeds/*.yaml", "features/*/seeds/*/"]
      excludePatterns: ["features/manifest-import/seeds/manifests/**"]
      regex: '^\s+-?\s*id:\s*"([^"]+)"'
      description: Manifest line ids are unique across seed files
      validation: cross-file-unique

    - name: Redis keys in seeds
      filePatterns: ["features/*/redis/*.yaml"]
      regex: '^"([^"]+)":'
      description: Every seeded Redis key has its own name
      validation: cross-file-unique

    - name: Depot scan ids
      filePatterns: ["features/*/seeds/*.json", "features/*/seeds/*/"]
      excludePatterns: ["features/manifest-import/seeds/manifests/**"]
      type: jsonpath
      jsonPath: "scans[*].scanId"
      description: Depot scans in MongoDB seeds have their own ids
      validation: cross-file-unique

# `axx fixtures`: fixtures generated from the committed *.factory.yaml, *.fixture.yaml
# and *.prototype.yaml files. Run `axx fixtures generate` to write them; they are
# gitignored and recorded in axx-fixtures.manifest.yaml.
fixtures:
  # The address service's response bodies live next to the files WireMock serves.
  sources: ["../infra/wiremock"]

  # Every seed file, hand-written or generated, must match the database schema.
  conformance:
    - name: seeds match the database schema
      filePatterns: ["features/*/seeds/*.yaml"]
      schemaType: dataset
      schemaRef: ../infra/postgres/init/01-schema.sql

  output: { ignored: true }
