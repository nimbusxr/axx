# The billing service and the Google Cloud it runs on.
#
#   docker compose up --build --wait     # start everything
#   docker compose down -v               # stop and remove everything
#
# axx runs this for you: see ../acceptance/axx.yaml.
#
# Google Cloud runs locally in floci (https://floci.io), a free, open-source
# emulator: one container, every service on port 4588. The service is set up
# exactly as for Google Cloud; only the emulator variables point it there.
name: carrier-billing

services:
  gcp:
    image: floci/floci-gcp:latest
    ports:
      - '4588:4588'
    environment:
      # BigQuery's SQL runs in floci's SQL engine, a service of its own here, which reads
      # the tables' rows back from the emulator.
      FLOCI_GCP_SERVICES_BIGQUERY_DUCK_URL: http://bigquery-sql:3000
      FLOCI_GCP_SERVICES_BIGQUERY_DUCK_CALLBACK_URL: http://gcp:4588
    depends_on:
      - bigquery-sql
    stop_signal: SIGKILL

  bigquery-sql:
    image: floci/floci-duck:latest
    stop_signal: SIGKILL

  # Creates the buckets, topics, subscriptions, the bucket notification and the
  # BigQuery tables, as the infrastructure code of a real project does; then exits.
  provision:
    image: carrier-billing:local
    build: ../app
    # TensorFlow's C library, which the service links in, is built for amd64 only: elsewhere
    # Docker emulates it.
    platform: linux/amd64
    command: ["provision"]
    environment: &gcp
      GOOGLE_CLOUD_PROJECT: parcels-billing
      STORAGE_EMULATOR_HOST: http://gcp:4588
      PUBSUB_EMULATOR_HOST: gcp:4588
      FIRESTORE_EMULATOR_HOST: gcp:4588
      BIGQUERY_ENDPOINT: http://gcp:4588
    depends_on:
      - gcp

  billing:
    image: carrier-billing:local
    build: ../app
    platform: linux/amd64
    ports:
      - '8600:8600'
    environment:
      <<: *gcp
      BILLING_ADDR: ':8600'
      # The repacks' photo check's classifier, which the service runs with TensorFlow: in this
      # test deployment, a stub that answers as its mappings say (models/repack-check/
      # saved_model.pb, which `axx models build` writes from ../acceptance/models/repack-
      # check). In production, the real model (MobileNetV2, of TF Hub, a SavedModel) is
      # mounted here.
      BILLING_REPACK_MODEL: /models/repack-check
    volumes:
      - ./models/repack-check:/models/repack-check:ro
    depends_on:
      provision:
        condition: service_completed_successfully
