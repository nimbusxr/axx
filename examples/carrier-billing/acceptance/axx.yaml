# yaml-language-server: $schema=https://axx.nimbusxr.us/schemas/v0/axx.schema.json
#
# The acceptance suite of the carrier-billing example. From this directory:
#   axx run      # start Google Cloud (floci) and the billing service, run every feature, clean up
version: 1

run:
  paths: [features]

# Paths in steps (invoices/INV-2026-09-KES1.csv, seeds/carrier-rates.yaml) resolve against this directory.
resources: ["."]

# ${sys:local.host} in the feature files; override with -D local.host=<name>.
properties:
  local.host: localhost

apps:
  billing:
    # ../infra/compose.yaml starts Google Cloud (floci), creates the resources, and starts the service.
    dir: ../infra
    command: docker compose up --build
    ready:
      http:
        url: http://localhost:8600/health
      timeout: 5m
      interval: 1s
    stop:
      grace: 10s
    cleanup: docker compose down -v --remove-orphans

# `axx lint`: scenarios run in parallel, so each invoice and shipment belongs to one.
lint:
  rules:
    - name: Shipments in seeds
      filePatterns: ["seeds/shipments-*.yaml"]
      regex: '^\s+(PX-\d+):'
      description: Every seeded shipment belongs to one scenario
      validation: cross-file-unique
