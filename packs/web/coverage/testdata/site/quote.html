<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Get a quote</title>
<script src="/dist/quote.js" defer></script>
</head>
<body>
<h1>Get a quote</h1>
<label for="weight">Weight (grams)</label>
<input id="weight" type="number">
<label for="country">Destination country</label>
<select id="country">
  <option>Germany</option>
  <option>France</option>
  <option>Japan</option>
</select>
<button id="quote">Get a quote</button>
<button id="cancel">Cancel the quote</button>
<p id="price"></p>
</body>
</html>
