# Generated by `go run ./cmd/evals sync` from task.toml and the starting project; do not edit.
# Infrastructure next to the main container (Harbor defines main itself).
services:
  main:
    environment:
      PARCELS_KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      address-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parcels
      POSTGRES_USER: parcels
      POSTGRES_PASSWORD: parcels
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "parcels", "-d", "parcels"]
      interval: 1s
      timeout: 2s
      retries: 90
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: parcels
      MONGO_INITDB_ROOT_PASSWORD: parcels
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 60
  address-service:
    image: axx-evals-address-service:latest
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/__admin/health"]
      interval: 1s
      timeout: 2s
      retries: 90
  kafka:
    image: apache/kafka-native:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 1s
      timeout: 5s
      retries: 90
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/subjects"]
      interval: 2s
      timeout: 2s
      retries: 90
