schema_version = "1.4"

[task]
name = "axx-evals/mongo-tracking-view"
description = "Acceptance tests for the MongoDB tracking read model: seed depot scans and assert the projected tracking view."
keywords = ["axx", "gherkin", "acceptance-testing", "mongodb"]

[metadata]
title = "MongoDB: seed scans, assert the read model"
difficulty = "medium"
category = "mongo"
requires = []
services = ["postgres", "mongo", "address-service"]
workspace = "common"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096

[environment.healthcheck]
command = "wait-for-services"
interval_sec = 2.0
timeout_sec = 10.0
start_period_sec = 120.0
retries = 60

[[artifacts]]
source = "/app"
exclude = [".axx", ".git"]
