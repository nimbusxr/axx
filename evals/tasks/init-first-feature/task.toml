schema_version = "1.4"

[task]
name = "axx-evals/init-first-feature"
description = "Set up axx in a repository that has none (axx init) and write its first acceptance test."
keywords = ["axx", "gherkin", "acceptance-testing", "setup", "init"]

[metadata]
title = "axx init a bare repository and write the first feature"
difficulty = "medium"
category = "setup"
requires = ["rest"]
services = ["postgres", "mongo", "address-service"]
workspace = "none"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096

[environment.healthcheck]
command = "wait-for-services"
interval_sec = 2.0
timeout_sec = 10.0
start_period_sec = 120.0
retries = 60

[[artifacts]]
source = "/app"
exclude = [".axx", ".git"]
