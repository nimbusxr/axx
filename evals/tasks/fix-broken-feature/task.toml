schema_version = "1.4"

[task]
name = "axx-evals/fix-broken-feature"
description = "Repair a feature file that has never passed: a step with the wrong text and a wrong expectation."
keywords = ["axx", "gherkin", "acceptance-testing", "debugging"]

[metadata]
title = "Fix a broken feature"
difficulty = "easy"
category = "debugging"
requires = []
services = ["postgres", "mongo", "address-service"]
workspace = "common"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096

[environment.healthcheck]
command = "wait-for-services"
interval_sec = 2.0
timeout_sec = 10.0
start_period_sec = 120.0
retries = 60

[[artifacts]]
source = "/app"
exclude = [".axx", ".git"]
