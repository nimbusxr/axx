# Generated by `go run ./cmd/evals sync` from task.toml and the starting project; do not edit.
# Infrastructure next to the main container (Harbor defines main itself).
services:
  main:
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      address-service:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parcels
      POSTGRES_USER: parcels
      POSTGRES_PASSWORD: parcels
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "parcels", "-d", "parcels"]
      interval: 1s
      timeout: 2s
      retries: 90
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: parcels
      MONGO_INITDB_ROOT_PASSWORD: parcels
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 60
  address-service:
    image: axx-evals-address-service:latest
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/__admin/health"]
      interval: 1s
      timeout: 2s
      retries: 90
